,"d":"빠짐없이 완전히 갖춤.","ex":"정보 서비스 회사로서는 자료 완비가 절대적인 요건이다.","cx":"“치어리더 전용 공간 완비”… 한 프로 야구 구단은 치어리더 전용 공간 완비로 근무 환경을 개선했다고 밝혔다. 이 공간은 휴게실, 의상 준비실, 개인 사물함 등 치어리더들에게 필요한 시설을 빠짐없이 갖추었다. 이에 따라 치어리더들은 경기 준비부터 휴식까지 두루 해결할 수 있는 환경을 확보하게 됐다.","r":[{"t":"유의어","w":"구비","d":"있어야 할 것을 빠짐없이 다 갖춤.","s":"법적 요건의 구비 없이는 절차를 진행할 수 없다."},{"t":"반의어","w":"미비","d":"아직 다 갖추지 못한 상태에 있음.","s":"안전시설의 미비로 대형 사고가 발생하였다."},{"t":"반의어","w":"결여","d":"마땅히 있어야 할 것이 빠져서 없거나 모자람.","s":"자기 확신, 자기 존중감의 결여는 생각보다 많은 문제들을 만들어 낸다."}]},{"n":202,"w":"완충","st":"완충","d":"대립하는 것 사이에서 불화나 충돌을 누그러지게 함.","ex":"언론은 사회적 갈등을 조정하는 완충 역할을 한다.","cx":"행정사는 민원 갈등의 완충 장치 역할을 한다. 행정기관은 법과 규정에 따라 움직이고, 시민은 개인의 사정과 관점에서 민원을 제기한다. 당연히 이 둘 사이엔 ‘틈’이 생긴다. 그 틈이 오해와 불신으로 번질 수 있는 상황에서, 행정사는 제도의 언어를 시민에게, 시민의 상황을 제도에 맞춰 통역하는 ‘중재자’가 된다.","r":[{"t":"유의어","w":"완화","d":"긴장된 상태나 급박한 것을 느슨하게 함.","s":"그는 기업에 대한 규제의 완화가 시급하다고 주장하였다."},{"t":"관련어","w":"완충재","d":"두 물체 사이에 끼어서 충격을 완화하는 재료.","s":"층간 소음을 획기적으로 줄여 주는 바닥 완충재가 새로 개발되었다."},{"t":"관련어","w":"완충 지대","d":"대립하는 나라들 사이의 충돌을 완화하기 위하여 설치한 중립 지대.","s":"그들은 완충 지대에서 군사를 철수하는 문제에 대해 합의하였다."}]},{"n":203,"w":"왜곡","st":"왜곡","d":"사실과 다르게 해석하거나 그릇되게 함.","ex":"그들은 역사 왜곡을 바로잡기 위해 노력하고 있다.","cx":"인터넷에서 사실과 다른 내용이 덧붙여진 사진이 퍼지면서 큰 혼란이 일었다. 원래의 상황과는 달리 보이도록 일부 장면만 잘라낸 것이 문제였다. 이런 왜곡 때문에 사람들은 실제로 무슨 일이 있었는지 정확히 이해하기 어려워졌다.","r":[{"t":"심리","w":"인지 왜곡","d":"그릇된 가정이나 잘못된 개념화를 이끌어 내는 체계적인 인지적 오류.","s":"주변 상황을 왜곡해서 그 의미를 해석하는 인지 왜곡은 왜곡을 부정하도록 학습하는 과정을 통해 치료할 수 있다."},{"t":"유의어","w":"곡해","d":"사실을 옳지 아니하게 해석함. 또는 그런 해석.","s":"내가 말을 잘못했는지는 모르겠으나 너무 곡해를 하십니다."},{"t":"유의어","w":"오해","d":"그릇되게 해석하거나 뜻을 잘못 앎. 또는 그런 해석이나 이해.","s":"다른 뜻은 없으니 오해는 마십시오."}]},{"n":204,"w":"외면적","st":"외면적","d":"겉으로 나타난 모양에만 관계된.","ex":"외면적 모습만 보고 사람을 쉽게 판단해서는 안 된다.","cx":"많은 기업이 화려한 사옥과 세련된 광고를 통해 성장한 모습을 강조한다. 겉으로 드러나는 성과만 보면 성공한 것처럼 보이지만, 내부 직원들의 근무 환경 이나 조직 문화 문제는 해결되지 않는 경우가 많다. 그래서 이런 변화는 내실을 외면한 외면적 개선에 그친다는 지적이 나온다.","r":[{"t":"유의어","w":"표면적","d":"겉으로 나타나거나 눈에 띄는.","s":"수요가 급증해서 가격을 올린다는 것은 표면적 이유에 불과하다."},{"t":"문학","w":"외면 묘사","d":"행동이나 몸가짐과 같은, 겉으로 드러난 상태를 묘사함으로써 성격이나 심리를 나타내려고 하는 인물 묘사의 한 방법.","s":"B사감에 대한 외면 묘사는 그 여자의 뒤틀린 내면을 반영한다."}]},{"n":205,"w":"외재","st":"외재","d":"어떤 사물이나 범위 안에 있지 않고 밖에 있음. 또는 그런 존재.","ex":"성공은 외재 조건뿐 아니라 개인의 노력에도 크게 좌우된다.","cx":"청소년의 학업 스트레스에는 여러 요인이 있다. 스스로 세운 목표나 성취욕처럼 안에서 비롯된 내재 요인도 있지만, 부모의 기대, 친구와의 경쟁, 입시 제도 같은 외재 요인도 큰 영향을 미친다. 전문가들은 문제가 생겼을 때 두 측면을 함께 살 펴야 균형 잡힌 해결책을 찾을 수 있다고 조언한다.","r":[{"t":"관련어","w":"외재성","d":"사물의 안에 있지 아니하고 밖에 있는 성질.","s":"점수나 칭찬 같은 보상은 외재성이 강한 동기라고 할 수 있다."},{"t":"반의어","w":"내재","d":"어떤 사물이나 범위의 안에 들어 있음. 또는 그런 존재.","s":"예술 작품의 감동은 외재 형태와 내재 의미가 조화를 이룰 때 극대화된다."},{"t":"문학","w":"외재비평","d":"예술 작품을 하나의 사회 현상으로 보고, 사회적인 측면에서 작품이 갖는 의의를 찾아내려고 하는 비평.","s":"외재비평을 중시하다 보면 문학 고유의 특질을 놓치기 쉽다."}]},{"n":206,"w":"인접","st":"인접","d":"이웃하여 있음. 또는 옆에 닿아 있음.","ex":"인접 국가와의 인적 교류가 더 활발해져 가고 있다.","cx":"갑작스런 화재로 인해 상가와 인접 건물에 큰 피해가 발생했다. 콘센트와 이웃한 전열 기구의 가열이 화재 원인이었으며 두 건물의 밀접이 피해를 더 키웠다.","r":[{"t":"유의어","w":"밀접","d":"아주 가깝게 맞닿아 있음. 또는 그런 관계에 있음.","s":"두 학문 간의 밀접은 새로운 연구 가능성을 열어 주었다."},{"t":"유의어","w":"이웃","d":"나란히 또는 가까이 있어서 경계가 서로 붙어 있음.","s":"그는 학교가 이웃인데도 매일 지각을 한다."},{"t":"수학","w":"인접각","d":"꼭짓점과 한 변을 공유하는 두 각.","s":"인접각의 성질을 이용하면 다각형에서 내각의 합을 증명할 수 있다."}]},{"n":207,"w":"일률적","st":"일률적","d":"태도나 방식 따위가 한결같은.","ex":"정부는 불법 이민자들에게 일률적 처벌을 내리지 않기로 했다.","cx":"일률적 기준으로 장학생을 선발하면 학생들 개개인의 사정을 반영하기가 어렵다. 일정한 방식으로 공정하게 선발하는 것도 중요하지만 실질적으로 어려운 학생들을 선발할 필요도 있다.","r":[{"t":"유의어","w":"규칙적","d":"일정한 질서가 있거나 규칙을 따르는.","s":"기상 관측 자료에서는 계절에 따라 규칙적 변화가 뚜렷하게 나타난다."},{"t":"사회","w":"천편일률적 구조","d":"사물이 모두 똑같은 틀로 찍은 것처럼 동일하여 개성이 없는 형태의 구조.","s":"기획안이 천편일률적 구조에서 벗어나지 못하여 심사위원들의 질문이 반복됐다."}]},{"n":208,"w":"보류","st":"보류","d":"어떤 일을 당장 처리하지 아니하고 나중으로 미루어 둠.","ex":"그의 결정 보류로 우리의 계획은 상당한 차질을 빚었다.","cx":"학교에서 장학금 지급 보류 문자를 받고 추가 서류를 제출했다. 등록금 납부 연기가 더 이상 불가능해서 서류 제출을 미룰 수 없었기 때문이다.","r":[{"t":"유의어","w":"연기","d":"정해진 기한을 뒤로 물려서 늘림.","s":"학교는 갑작스러운 지진으로 기말고사 연기를 결정했다."},{"t":"유의어","w":"유예","d":"일을 결행하는 데 날짜나 시간을 미룸.","s":"정부는 금융 제재 조치의 일정 기간 유예가 가능하다고 밝혔다."},{"t":"체육","w":"보류 선수","d":"프로 스포츠에서, 계약을 잠시 미루어 둔 선수.","s":"구단에서는 그를 보류 선수 명단에 넣어 둬 재계약 가능성을 남겼다."}]},{"n":209,"w":"입각하다","st":"입각","d":"어떤 사실이나 주장 따위에 근거를 두어 그 입장에 서다.","ex":"그가 법정에서 한 말은 사실에 입각한 주장이 아니다.","cx":"모든 평가는 공개된 기준과 데이터에 입각해 진행한다. 명확한 기준에 근거하지 않은 평가는 공정하지 못하다는 인식을 주어 평가의 신뢰도를 떨어뜨린다.","r":[{"t":"동형이의어","w":"입각하다","d":"내각의 한 사람이 되다.","s":"입각한 지 석 달도 못 돼 물의를 일으킨 장관이 사표를 제출했다."},{"t":"유의어","w":"기초하다","d":"근거를 두다.","s":"대학 당국은 엄격한 기준에 기초하여 학생을 선발해야 한다."},{"t":"유의어","w":"근거하다","d":"어떤 일이나 의논, 의견에 그 근본이 되다.","s":"그 작가는 주로 사료에 근거한 역사 소설을 쓴다."}]},{"n":210,"w":"잠재","st":"잠재","d":"겉으로 드러나지 않고 속에 잠겨 있거나 숨어 있음.","ex":"이 소설은 인간의 잠재 욕망을 생생하게 그려 내었다.","cx":"모든 사람은 저마다의 잠재 역량이 있다. 지금 그 역량을 눈으로 확인할 수 없다고 해서 자신에게는 역량이 없다고 슬퍼할 필요가 없다 개인의 노력이 적절한 환경적 조건과 맞아떨어질 때 잠복 중인 그 역량이 겉으로 드러날 것이기 때문이다.","r":[{"t":"유의어","w":"잠복","d":"겉으로 드러나지 않게 숨음.","s":"김 형사는 일주일 동안의 잠복 끝에 범인을 체포했다."},{"t":"반의어","w":"가시화","d":"어떤 현상이 실제로 드러남.","s":"이번 프로젝트를 지속하기 위해서는 성과의 가시화가 필요하다."},{"t":"경제","w":"잠재 고객","d":"현재는 고객이 아니지만 잠재적으로 고객이 될 가능성이 있는 구매자.","s":"이번 광고의 목표는 제품 인지도를 높여 잠재 고객을 유입하는 것이다."}]},{"n":211,"w":"비중","st":"비중","d":"다른 것과 비교할 때 차지하는 중요도.","ex":"이 대학은 다른 대학보다 입시에서 내신 점수의 비중이 높다.","cx":"그 다큐멘터리는 그의 일대기를 다루는 것이었지만 40~50대 때의 이야기가 전체의 70%를 차지했다. 해당 시기에 보인 그의 활동이 업계에서는 가장 높게 평가되기 때문에 특정 시기가 큰 비중으로 다루어질 수밖에 없었던 것이다.","r":[{"t":"유의어","w":"무게","d":"사물이 지닌 가치나 중요성의 정도.","s":"그 소설은 한국 문학에서 무게 있는 작품으로 손에 꼽힌다."},{"t":"유의어","w":"중요도","d":"소중하고 요긴한 정도.","s":"우리나라에서 쌀은 중요도가 가장 높은 곡식이다."},{"t":"물리","w":"비중","d":"같은 부피일 때 얼마나 무거운지를 비율로 나타낸 것.","s":"중금속이 풍부한 암석은 비중이 크다."}]},{"n":212,"w":"재개","st":"재개","d":"어떤 활동이나 회의 따위를 한동안 중단했다가 다시 시작함.","ex":"이번 사건으로 인해 남북한 고위급 회담의 재개 여부가 불투명해졌다.","cx":"급변하는 국제 사회에서 우리 경제의 앞날이 다시 어두워졌다. 경제 발전을 계속 이어 나가기 위해서는 무역 당사국 간 중단되었던 협상의 재개가 절실하다.","r":[{"t":"동형이의어","w":"재개","d":"한 번 고친 것을 다시 고침.","s":"설계안의 오류를 발견하여 도면 재개의 필요성이 제기되고 있다."},{"t":"반의어","w":"중단","d":"중도에서 끊어지거나 끊음.","s":"연구소에 대한 정부 지원이 끊기면서 그 실험은 중단이 되고 말았다."},{"t":"유의어","w":"계속","d":"끊어졌던 행위나 상태를 다시 이어 나감.","s":"오늘 강의는 지난 강의의 계속이다."}]},{"n":213,"w":"쟁점","st":"쟁점","d":"서로 다투는 중심이 되는 점.","ex":"핵폐기물의 처리 문제가 이번 협상 에서 가장 뜨거운 쟁점이 되었다.","cx":"토론 수업에서는 학생들이 스스로 쟁점을 도출하는 것이 중요하다. 논점을 파악하는 연습을 통해 우리 사회의 문제점을 이해하고 합의점을 찾아 나갈 수 있다.","r":[{"t":"유의어","w":"논점","d":"의견을 내어 옳고 그름을 따지고자 하는 주제의 요점.","s":"그는 논점을 흐리며 정확한 답변을 피했다."},{"t":"유의어","w":"문제점","d":"어떤 사물이나 현상에서 해결해야 하거나 개선해야 할 점.","s":"문제점을 정확히 파악하여 개선 방안을 찾도록 해야 한다."},{"t":"정치","w":"쟁점 안건","d":"의견이 달라서 토의하거나 조사해야 할 사실.","s":"이 번 임시 국회에서는 정부 조직법 개정안이 거의 유일한 쟁점 안건이다."}]},{"n":214,"w":"논하다","st":"논","d":"의견이나 이론을 조리 있게 말하다.","ex":"또는 옳고 그름 따위를 따져 말하다. 그들은 국내외 정세를 논하면서 시간을 보냈다.","cx":"학생들은 행복의 의미에 대해 논하라는 과제를 받고, 자신의 경험이나 평소 생각을 근거로 들어 행복에 대한 각자의 견해를 나누었다. 학생들이 각자의 생각을 조리 있게 말할수록 행복의 의미에 대한 풍부한 이야기가 오갈 수 있었다.","r":[{"t":"유의어","w":"논의하다","d":"어떤 문제에 대하여 서로 의견을 내어 토의하다.","s":"우 리는 그 일을 추진할 것인지를 논의했지만 결론을 내지는 못했다."},{"t":"유의어","w":"말하다","d":"평하거나 논하다.","s":"한 비평가가 내 글에 대하여 좋게 말했다고 한다."},{"t":"하의어","w":"평론하다","d":"사물의 가치, 우열, 선악 따위를 평가하여 논하다.","s":"친구가 내가 쓴 소설을 평론해 주었다."}]},{"n":215,"w":"다층","st":"다층","d":"여러 층.","ex":"이 도시의 다층 건물은 상업 시설과 주거 공간을 수직적 으로 통합하여 설계되었다.","cx":"중앙 서버를 보호하기 위해 침입 탐지 시스템, 접근 제어, 암호화 등의 기술을 겹겹이 쌓아 올린 다층 방어 체계를 구축했다. 이것은 보안 기술을 세분화한 것으로, 하나의 단계가 뚫려도 다음 단계가 방어하는 방식이다.","r":[{"t":"반의어","w":"단층","d":"하나로만 이루어진 층. 또는 그런 층으로 된 것.","s":"돌계단을 올라섰을 때 단층 목조 건물이 눈앞에 나타났다."},{"t":"사회","w":"다층 구조 사회","d":"여러 가지 원리와 원칙이 병존하는 횡적 관계와, 문제 해결을 위하여 여러 조정 단계를 거쳐야 하는 종적 관계가 복잡하게 얽히어 있는 사회.","s":"교 육의 기회, 소득 수준, 사회적 네트워크 등의 요소들이 서로 영향을 주며 다층 구조 사회를 형성한다."},{"t":"물리","w":"다층막","d":"빛의 파장 정도의 두께로서, 굴절률이 다른 투영막을 교대로 겹치어 만든 막. 빛의 흡수가 거의 없고 막의 굴절률의 조합, 막 두께의 선택에 따라 반사 또는 투과된 빛의 분광 특성을 자유롭게 바꿀 수 있다.","s":"빛 이 서로 다른 굴절률을 가진 다층막을 통과할 때 간섭이 일어나 특정 파장의 빛이 선택적으로 반사된다."}]},{"n":216,"w":"단편적","st":"단편적","d":"전반에 걸치지 않고 한 부분에 국한된 것.","ex":"그의 근황에 대해서는 가끔 단편적으로 들었다.","cx":"우리는 SNS에서 특정 사건의 일부분만을 잘라 낸 단편적인 정보만을 접하는 경우가 많다. 단편적인 정보를 보고 그것이 전부를 담고 있다고 생각하면 안 된다. 전체적인 맥락이나 배경을 파악하지 못하고 해당 상황을 오해하기 쉽기 때문이다.","r":[{"t":"관련어","w":"단편","d":"전반에 걸치지 않고 한 부분에만 국한된 조각.","s":"지식의 단편만을 전달하는 교육은 쓸모없는 것이다."},{"t":"유의어","w":"국부적","d":"전체의 어느 한 부분에만 한정되는 것.","s":"그녀는 항상 국부적인 문제에 집착하는 버릇이 있다."},{"t":"반의어","w":"전체적","d":"전체에 관계된 것.","s":"오케스트라에서는 전체적인 조화와 통일이 중요하다."}]},{"n":217,"w":"당위","st":"당위","d":"마땅히 그렇게 하거나 되어야 하는 것.","ex":"그는 통일은 선택이 아니라 당위라고 주장했다.","cx":"경제 개발 계획을 수립할 때, 단기적인 경제 성장 수치에 매몰되기 쉽다. 그러나 국민 전체의 복리 증진이라는 당위를 목표로 삼고, 소득 격차 해소와 환 경 보호 등을 함께 고려하는 것이 진정한 경제 개발 계획이라고 할 수 있을 것이다.","r":[{"t":"관련어","w":"당위성","d":"마땅히 그렇게 하거나 되어야 할 성질.","s":"전쟁을 꼭 해야 할 당위성이 있는가?"},{"t":"유의어","w":"필연","d":"사물의 관련이나 일의 결과가 반드시 그렇게 될 수밖에 없음.","s":"절대 권력이 결국에는 부패한다는 것은 역사의 필연이다."},{"t":"윤리","w":"도덕적 당위","d":"도덕적으로 마땅히 해야 할 행위. 또는 윤리학의 기본적 개념 가운데 하나로, 칸트의 정언적 명령에서 시작된 개념이다.","s":"칸트는 어떤 행위의 도덕적 가치는 그 행위가 낳은 결과가 아니라, 오로지 도덕 법칙에 대한 존중에서 비롯된 도덕적 당위에 따라 행해졌는지에 달려 있다고 주장한다."}]},{"n":218,"w":"대안","st":"대안","d":"어떤 일에 대처할 방안.","ex":"갑자기 닥친 일이라 대안이 쉽게 떠오르지 않는다.","cx":"극심한 가뭄으로 농업용수 부족 문제가 심각한 상황에 이르렀다. 문제를 해결하기 위한 방안으로 지하수댐 개발이라는 대안이 제안되었다. 정부는 그것을 문제 상황에 대처할 최적의 방법으로 보고 심도 있게 검토하고 있다. 수준: 중등, 4등급","r":[{"t":"동형이의어","w":"대안","d":"어떤 안(案)을 대신하는 안.","s":"이 방법도 썩 좋지는 않으나 다른 대안이 없으니 어쩔 수 없다."},{"t":"유의어","w":"대책","d":"어떤 일에 대처할 계획이나 수단.","s":"근본적인 대책을 마련해야 한다."},{"t":"유의어","w":"방도","d":"어떤 일을 하거나 문제를 풀어 가기 위한 방법과 도리.","s":"머리를 짜 보았으나 좋은 방도가 떠오르지 않았다."}]},{"n":219,"w":"도모","st":"도모","d":"어떤 일을 이루기 위하여 대책과 방법을 세움.","ex":"부원들 간의 친목 도모를 위해 주말에 다 같이 등산을 가기로 했다.","cx":"그는 다음 시험에서 보다 높은 성적을 얻기 위해 취약한 과목에 대한 보충 학습 계획 과 학습 시간 배분 방법을 궁리했다. 충분히 준비했다고 생각한 이번 시험에서 만족할 만한 결과를 얻지 못했기 때문에 더 치밀한 도모가 필수적이었다.","r":[{"t":"관련어","w":"도모하다","d":"어떤 일을 이루기 위한 대책과 방법을 세우다.","s":"내가 어찌 혼자 살기를 도모하겠는가."},{"t":"유의어","w":"강구","d":"좋은 대책과 방법을 궁리하여 찾아내거나 좋은 대책을 세움.","s":"눈앞에 닥친 위기를 극복하기 위해 치밀한 사전 계획을 세웠다."}]},{"n":220,"w":"도식","st":"도식","d":"사물의 구조, 관계, 변화 상태 따위를 일정한 양식으로 나타낸 그림.","ex":"또는 그 양식. 복잡한 기업의 조직 체계를 한눈에 파 악할 수 있도록 부서 간의 위계와 협력 관계를 나타내는 도식을 만들었다.","cx":"복잡한 시스템의 작동 원리를 설명할 때에는 문장으로 길게 설명하는 것보다 하나의 간결한 도식으로 나타내는 것이 더 편할 수 있다. 도식으로 제시하는 것이 핵심 구조와 요소 간의 연결 상태를 시각적으로 더 명확하게 보여 주기 때문이다 .","r":[{"t":"관련어","w":"도식화하다","d":"사물의 구조, 관계, 변화 상태 따위를 그림이나 양식으로 만들다.","s":"그는 새로 살 집을 도식화하여 아내에게 보여 주었다."},{"t":"관련어","w":"도식성","d":"이미 있어 온 양식을 그대로 따르는 성질 또는 특성.","s":"상상력이 풍부한 작가는 쉽게 도식성을 탈피할 수 있다."},{"t":"상위어","w":"양식","d":"일정한 모양이나 형식.","s":"주어진 양식에 따라 보고서를 제출하시오."}]},{"n":221,"w":"동태","st":"동태","d":"움직이거나 변하는 모습.","ex":"그는 성공적인 투자를 위해 최근 3개월간의 시장 동태를 분석했다.","cx":"작전 지휘부는 적군의 병력 배치와 이동 경로를 실시간으로 분석했다. 적이 특정 위치에 머물러 있지 않고 계속해서 이동했기 때문이다. 아군의 피해를 최소화하기 위해서는 적의 동태를 잘 살펴 모든 움직임을 포착해야 했다.","r":[{"t":"반의어","w":"정태","d":"움직이지 아니하고 가만히 있는 상태.","s":"현 재 인구는 인구 정태의 한 가지로, 조사 시점에 각 개인의 현재지에 있어서의 인구수를 집계한 것이다."},{"t":"관련어","w":"동태 분석","d":"어떤 현상에 대하여 일정 기간의 변동 상태를 분석하는 일.","s":"한국은행은 환율 변동이 소비자 물가에 미치는 영향에 대한 물가 동태 분석 보고서를 발표했다."},{"t":"사회","w":"인구 동태","d":"일정한 기간 동안에 출생, 사망, 유입, 유출, 결혼, 이혼 따위로 일어나는 인구 변동의 상태. 지역의 사회적·경제적 조건과 밀접한 관계를 가지므로 그 지역의 모든 특징을 나타내는 하나의 지표로 이용된다.","s":"통계청은 최근 10년간의 인구 동태를 분석했다."}]},{"n":222,"w":"변수","st":"변수","d":"어떤 상황의 가변적 요인.","ex":"맑음 흐림 비 눈 우리 여행의 가장 큰 변수는 날씨이다.","cx":"이번 회담을 위해서 많은 부서들이 노력하고 있다. 특별한 변수가 없는 한, 회담은 예정대로 진행될 것이다.","r":[{"t":"유의어","w":"변인","d":"성질이나 모습이 변하는 원인.","s":"해당 현상의 구체적인 변인을 찾아 연구하다."},{"t":"수학","w":"상수","d":"변하지 아니하는 일정한 값을 가진 수나 양.","s":"원의 지름에 대한 둘레의 비율을 의미하는 π는 유명한 상수이다."},{"t":"수학","w":"독립 변수","d":"함수 관계에서, 다른 변수의 변화와는 관계없이 독립적으로 변화하고 이에 따라 다른 변수의 값을 결정하는 변수.","s":"방정식 y=f(x)에서 x는 독립 변수이고 x에 의해 변하는 y는 종속 변수이다."}]},{"n":223,"w":"변인","st":"변인","d":"성질이나 모습이 변하는 원인.","ex":"식물이 잘 자라는 데에는 빛과 물이 중요한 변인이다.","cx":"아침에 지각한 이유는 ‘버스 고장’이라는 예기치 못한 변인이 작용했기 때문이다. 지각을 하지 않기 위해 일찍 일어났는데 헛수고가 되었다.","r":[{"t":"상위어","w":"원인","d":"어떤 사물이나 상태를 변화시키거나 일으키게 하는 근본이 된 일이나 사건.","s":"사고의 원인을 분석해 보았다."},{"t":"유의어","w":"독립 변인","d":"실험자가 실험 조건으로 조작하는 변수.","s":"미래의 전망에서 빠뜨릴 수 없는 또 다른 변수는 과학 기술의 발전이다."}]},{"n":224,"w":"병합","st":"병합","d":"둘 이상의 기구나 단체, 나라 따위가 하나로 합쳐짐. 또는 그렇게 만듦.","ex":"둘 이상의 원소가 화합되면 단순한 병합이 아니라 새로운 물질이 만들어진다.","cx":"A회사와 B회사의 병합으로 C회사가 설립되었다. 은행이었던 A회사와 보험 회사였던 B회사가 합쳐져 C회사는 은행과 보험 회사의 성격을 둘 다 가지고 있다.","r":[{"t":"유의어","w":"합병","d":"둘 이상의 기구나 단체, 나라 따위가 하나로 합쳐짐.","s":"하와이와 지가 사태 악화를 막았다. 경찰이 그의 행동을 제지하지 않았다면 이번 사건이 걷잡을 수 없이 확산되는 계기가 되었을 것이다.","r":[{"t":"유의어","w":"제지","d":"말려서 못 하게 함.","s":"그는 아버지의 말에 대꾸를 하려다가 누나에게 제지를 당했다."},{"t":"유의어","w":"금지","d":"어떤 일이나 행동 등을 하지 못하게 막음.","s":"정부의 한 관계자는 일반인 무기 휴대 금지를 계속하겠다고 밝혔다."},{"t":"반의어","w":"촉진","d":"다그쳐 빨리 나아가게 함.","s":"광고는 가장 대표적인 판매 촉진의 수단이다."}]},{"n":237,"w":"저하","st":"저하","d":"정도, 수준, 능률 따위가 떨어져 낮아짐.","ex":"그는 최근 시력 저하가 심해져서 안과를 찾아갔다.","cx":"수험생들에게 과도한 스트레스는 집중력 저하를 불러온다. 그로 인해 나타나는 인지 능력의 쇠퇴는 기억력에 영향을 주어 성적이 떨어지는 결과를 초래한다.","r":[{"t":"유의어","w":"저조","d":"활동이나 감정이 왕성하지 못하고 침체함.","s":"그날 강연장 분위기 저조의 책임은 강사에게 있었다."},{"t":"유의어","w":"쇠퇴","d":"힘이나 세력 따위가 약해져 전보다 못한 상태로 됨.","s":"중년층에서는 기억력의 쇠퇴를 고민하는 사람들이 많아졌다."},{"t":"관련어","w":"저하하다","d":"정도, 수준, 능률 따위가 떨어져 낮아지다.","s":"관리들의 수탈로 주민들의 생활은 형편없이 저하하였다."}]},{"n":238,"w":"저해","st":"저해","d":"막아서 못 하도록 해침.","ex":"지역감정의 심화는 날이 갈수록 국민 단합의 저해 요인이 되고 있다.","cx":"과열된 내부 경쟁이 조직 내 협업 문화 저해의 원인으로 드러났다. 불필요한 경쟁이 팀원들의 협동을 막아서 궁극적으로는 조직의 성장에 해를 끼치게 된다.","r":[{"t":"유의어","w":"방해","d":"남의 일을 간섭하고 막아 해를 끼침.","s":"공부에 방해가 되니까 나가서 놀아라."},{"t":"유의어","w":"장애","d":"어떤 사물의 진행을 가로막아 거치적거리게 하거나 충분한 기능을 하지 못하게 함.","s":"도로와 같은 사회 간접 자본의 부족이 산업 발전에 장애가 되고 있다."},{"t":"화학","w":"저해 물질","d":"물질의 작용을 방해하여 그 반응의 진행을 억제하는 물질.","s":"연구팀은 세포 성장을 방해하는 저해 물질의 특성을 분석했다."}]},{"n":239,"w":"전례","st":"전례","d":"이전부터 있었던 사례.","ex":"환경 파괴의 규모는 전례를 찾아 볼 수 없을 만큼 빠르게 확대되었다.","cx":"난민 문제를 해결하기 위해 국제사회에서도 전례를 찾기 힘든 협력이 양국 간에 이루어졌다. 두 나라의 정상은 외교적 관행을 지키기보다는 인도주의적 협력에 힘을 모았다.","r":[{"t":"유의어","w":"관례","d":"예로부터 굳어져 계속 전해 온 사례나 관습.","s":"올해 정기 승진 인사는 관례대로 3월에 있을 예정이다."},{"t":"유의어","w":"초유","d":"처음으로 있음.","s":"잘못된 관행은 마땅히 고쳐야 한다."}]},{"n":240,"w":"전면","st":"전면","d":"일정한 범위 안의 모든 부분.","ex":"이번 협상의 결과 금융 시장까지도 전면 개방을 할 예정이다.","cx":"수변 공원은 안전 문제로 시설 야간 개장을 전면 중단했다. 안전 문제는 일부 시설에만 국한된 것이 아니기 때문에 공원 내에 설치된 모든 운동 기구는 당분간 야간에 이용할 수 없다.","r":[{"t":"유의어","w":"전체","d":"여러 요소들로 이루어진 것의 온 덩어리.","s":"우리는 산 전체의 모양을 파악하기 위해 항공 촬영을 하였다."},{"t":"반의어","w":"부분","d":"전체를 몇 개로 나눈 것의 하나.","s":"그 책의 시작 부분은 별로 재미없다."},{"t":"동형이의어","w":"전면","d":"물체의 앞쪽 면.","s":"나는 길가에 서서 건물의 전면을 쳐다보았다."}]},{"n":241,"w":"집합하다","st":"집합","d":"사람들이 한곳으로 모이다.","ex":"지역 주민 설명회가 열리는 날, 참가자들이 마을 회관으로 미리 와서 집합했다.","cx":"지진 대피 훈련으로 오후 2시에 사이렌이 울렸다. 담임 선생님의 안내에 따라 학생들이 운동장으로 이동했다. 잠시 후 전교생이 운동장에 집합했다.","r":[{"t":"사회","w":"집합 금지","d":"여러 사람이 한곳에 모이는 것을 금지함.","s":"감 염병 확산을 막기 위해 정부는 일정 인원 이상의 집합 금지 명령을 내렸다."},{"t":"사회","w":"집합 행동","d":"여러 사람이 모여 함께 취하는 행동을 통틀어 이르는 말.","s":"환 경 오염 문제를 해결하기 위해 학생들과 시민들이 함께 거리 행진을 벌인 것은 사회 변화를 요구하는 집합 행동의 한 모습이다."},{"t":"기술","w":"데이터 집합","d":"데이터 분석이나 컴퓨터 과학에서, 관련된 자료를 모아놓은 것.","s":"인공지능 모델을 훈련시키려면 대규모의 데이터 집합이 필요하다."}]},{"n":242,"w":"차등","st":"차등","d":"고르거나 가지런하지 않고 차별이 있음. 또는 그렇게 대함.","ex":"정부는 소득 수준에 따라 세금을 차등 부과하여, 형편이 넉넉한 사람은 더 많이 내고 소득이 적은 사람은 덜 내도록 했다. VS","cx":"우리 학교에는 열심히 공부하는 학생들을 지원하기 위한 장학금 제도가 있다. 학교는 성적에 따라 장학금을 차등 지급했다. 성적이 높은 학생은 더 많은 장학금을 받았고, 성적이 낮은 학생은 적은 금액을 받았다.","r":[{"t":"사회","w":"차등 대우","d":"사람이나 집단을 일정한 기준에 따라 다르게 대하는 것.","s":"사회에서는 성별이나 출신 지역에 따라 차등 대우를 해서는 안 된다."},{"t":"경영","w":"차등 보상","d":"노력이나 성과, 조건에 따라 주어지는 대가나 혜택의 크기를 다르게 하는 것.","s":"기 업에서 판매 실적에 따른 차등 보상을 시행하자 직원들의 경쟁심이 높아졌다."},{"t":"관련어","w":"차등적","d":"고르거나 가지런하지 않고 차별이 있는 것.","s":"수 도권과 지방 병원 사이에 의료 서비스가 차등적으로 제공되면, 어떤 환자는 충분한 치료를 받지만 다른 환자는 그렇지 못해 불편을 겪을 수 있다."}]},{"n":243,"w":"창출하다","st":"창출","d":"전에 없던 것을 처음으로 생각하여 지어내거나 만들어 내다.","ex":"마을 주민들은 버려진 공터를 꽃과 나무로 꾸며 친환경적 공간을 창출했다.","cx":"학생들이 학교 축제에서 직접 만든 동아리 굿즈를 판매했다. 굿즈가 잘 팔려서 작은 수익을 창출했다. 학생들은 그 수익을 지역 아동 복지 단체에 기부했다.","r":[{"t":"경제","w":"고용 창출","d":"새로운 일자리가 생길 수 있는 여건이나 환경을 만들어 냄. 또는 그렇게 하여 직장이 없는 사람을 취직시킴.","s":"관 광 산업의 활성화는 숙박, 교통, 상점 등 다양한 분야에서 고용 창출 효과를 가져왔다."},{"t":"경제","w":"이윤 창출 기업","d":"총수입이 총비용보다 커서 수익이 발생하는 기업.","s":"이 윤 창출 기업은 자신들의 수익을 지역 사회의 일자리나 시설을 늘리는 데 재투자하여 지역 경제가 더 활발해지고 발전하는 데 도움을 준다."},{"t":"경영","w":"가치 창출","d":"전에 없던 새로운 아이디어·활동·산업 등을 통해 사회나 개인에게 유용한 가치를 새로 만들어 내는 것.","s":"기 업은 고객의 구매 기록과 선호도를 분석하여 맞춤형 상품을 추천하고, 이를 통해 매출을 늘리는 동시에 데이터 분석을 통한 혁신적 가치 창출에 성공했다."}]},{"n":244,"w":"첨부하다","st":"첨부","d":"안건이나 문서 따위를 덧붙이다.","ex":"주민들은 도로 파손 <script>
(function(){

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

const cleanW = w => w.replace(/\(\d\)$/,'');
const CSS = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function stemHTML(sent, stem, mode, cls){
  const s=esc(sent), st=esc(stem);
  if(!st || !s.includes(st)) return s;
  const rep = mode==='blank' ? '<span class="blank">?</span>' : mode==='fill' ? `<span class="fill ${cls||''}">${st}</span>` : `<b>${st}</b>`;
  return s.split(st).join(rep);
}
const store = {

};

const save = () => store.set('settings', S);

const isLinked = (a,b) => (linked.get(a)&&linked.get(a).has(b))||(linked.get(b)&&linked.get(b).has(a));

const spriteCache = {};

  const key=kind+'|'+mood; const W=16,H=16;

const mus={name:null,song:null,step:0,next:0,timer:null};
function playSong(name){

function sched(){ if(!mus.song||!ok()) return; const s=mus.song, e=60/s.bpm/2;

const PAL = () => ['--yellow','--pink','--blue','--green','--orange'].map(CSS);
const fx=(()=>{ const cv=$('#fx'), c=cv.getContext('2d'); let P=[],run=false,dpr=1;
  function size(){ dpr=Math.min(2,devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; } size(); addEventListener('resize',size);
  function loop(){ c.clearRect(0,0,cv.width,cv.height); P=P.filter(p=>p.life>0);
    for(const p of P){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life--; c.fillStyle=p.col; const s=p.s; c.fillRect(Math.round(p.x/s)*s,Math.round(p.y/s)*s,s,s); }
    if(P.length) requestAnimationFrame(loop); else run=false; }
  const go=()=>{ if(!run){ run=true; requestAnimationFrame(loop);} };
  return {
    burst(x,y,n){ if(RM) return; const pal=PAL(); for(let i=0;i<(n||40);i++){ const a=Math.random()*6.283, sp=(3+Math.random()*8)*dpr; P.push({x:x*dpr,y:y*dpr,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3*dpr,g:.3*dpr,s:Math.round((6+Math.random()*6)*dpr),col:rand(pal),life:45+Math.random()*30}); } go(); },
    rain(n){ if(RM) return; const pal=PAL(); for(let i=0;i<(n||180);i++) P.push({x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*4)*dpr,g:.04*dpr,s:Math.round((6+Math.random()*6)*dpr),col:rand(pal),life:200+Math.random()*80}); go(); }
  };
})();

function distractors(card,n,keyFn,k,ban,seed){
  ban=ban||[]; const banS=new Set([card.w,...ban]);
  const good=c=>!banS.has(c.w)&&!isLinked(c.w,card.w)&&!ban.some(b=>isLinked(c.w,b));
  const out=[], seen=new Set(seed||[keyFn(card)]);
  for(const tier of [D.filter(c=>good(c)&&kind(c.w)===k), D.filter(good)]){
    for(const c of shuffle(tier)){ if(out.length>=n) break; const key=keyFn(c); if(seen.has(key)) continue; seen.add(key); out.push(c); }
    if(out.length>=n) break; }
  return out;
}
const relOf = card => card.r.filter(r=>/유의어|반의어/.test(r.t) && cleanW(r.w)!==card.w);
const TL = {def:'뜻 보고 낱말 찾기', mean:'낱말 보고 뜻 찾기', rel:'비슷한 말 · 반대말', blank:'빈칸 채우기'};
function sentenceOf(card){ return (card.ex.length<14 || (Math.random()<.3 && card.cx.length<=140)) ? card.cx : card.ex; }
function makeQ(card,type){
  if(type==='rel' && !relOf(card).length) type='def';
  const q={card,type};
  if(type==='def'){ q.prompt=`<span class="sub2">이런 뜻을 가진 낱말은?</span>${esc(card.d)}`; q.answer=card.w; q.opts=shuffle([card.w,...distractors(card,3,c=>c.w,kind(card.w)).map(c=>c.w)]); }
  else if(type==='mean'){ q.prompt=`<span class="sub2">이 낱말의 뜻은?</span><span class="w">${esc(card.w)}</span>`; q.answer=card.d; q.long=true; q.opts=shuffle([card.d,...distractors(card,3,c=>c.d,kind(card.w)).map(c=>c.d)]); }
  else if(type==='blank'){ q.sent=sentenceOf(card); q.prompt=stemHTML(q.sent,card.st,'blank'); q.answer=card.w; q.opts=shuffle([card.w,...distractors(card,3,c=>c.w,kind(card.w)).map(c=>c.w)]); }
  else { const r=rand(relOf(card)), rw=cleanW(r.w), ant=/반의어/.test(r.t); q.rel=r;
    q.prompt=`<span class="sub2">‘${esc(card.w)}’와 뜻이 <b style="color:${ant?'var(--red)':'var(--forest)'}">${ant?'반대':'비슷'}</b>한 말은?</span>${stemHTML(r.s,stemOf(rw),'blank')}`;
    q.answer=rw; q.opts=shuffle([rw,...distractors(card,3,c=>c.w,kind(rw),card.r.map(x=>cleanW(x.w)),[rw,card.w]).map(c=>c.w)]); }
  return q;
}

const CFG = window.QUIZ_CONFIG || {};
const NET={db:null,room:'',players:{},meta:{},offset:0,listeners:new Set(),unsub:null,handledStart:0};
let inGame=false, onTeacher=false;
function fbConfigured(){ const f=CFG.firebase||{}; return !!(f.apiKey && f.databaseURL && !/여기|YOUR|붙여/.test(String(f.apiKey)+String(f.databaseURL))); }
const serverNow=()=>Date.now()+NET.offset;
function cleanRoom(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6); }
function deviceId(){ let id=store.get('device',''); if(!id){ id=Math.random().toString(36).slice(2,10); store.set('device',id); } return id; }
function pid(){ let h=7; const s=S.nick||''; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return deviceId()+'-'+h.toString(36); }
function notifyRank(){ NET.listeners.forEach(fn=>{ try{ fn(); }catch(e){} }); }
function netInit(){
  if(fbConfigured() && window.firebase){
    try{ firebase.initializeApp(CFG.firebase); NET.db=firebase.database(); NET.db.ref('.info/serverTimeOffset').on('value',s=>{ NET.offset=s.val()||0; }); }catch(e){ NET.db=null; }
  }
  const r=cleanRoom(new URLSearchParams(location.search).get('room'));
  if(r){ S.room=r; save(); }
  if(S.room) joinRoom(S.room);
}
function joinRoom(code){
  code=cleanRoom(code);
  if(NET.unsub){ NET.unsub(); NET.unsub=null; }
  NET.room=code; S.room=code; save(); NET.players={}; NET.meta={};
  if(NET.db && code){
    const pr=NET.db.ref('rooms/'+code+'/players'), mr=NET.db.ref('rooms/'+code+'/meta');
    let first=true;
    const a=pr.on('value',s=>{ NET.players=s.val()||{}; notifyRank(); });
    const b=mr.on('value',s=>{ NET.meta=s.val()||{}; if(first){ first=false; NET.handledStart=NET.meta.startAt||0; } notifyRank(); onMeta(); });
    NET.unsub=()=>{ pr.off('value',a); mr.off('value',b); };
  }
  notifyRank();
}
function rankList(){
  if(NET.db && NET.room) return Object.entries(NET.players).map(([id,v])=>Object.assign({id},v)).filter(x=>x&&typeof x.score==='number'&&x.name).sort((a,b)=>b.score-a.score||(a.at||0)-(b.at||0));
  return store.get('local',[]).slice().sort((a,b)=>b.score-a.score);
}
function myRank(){ const l=rankList(); const i=l.findIndex(x=>x.id===pid()); return {pos:i, total:l.length, list:l}; }
const Live={ref:null,lastSent:0,timer:0,val:0,best:0,
  start(){ this.ref=null; this.val=0; if(!NET.db||!NET.room) return;
    this.best=((NET.players[pid()]||{}).best)||0;
    this.ref=NET.db.ref('rooms/'+NET.room+'/players/'+pid());
    this.ref.update({name:S.nick,char:S.char,live:0,best:this.best,score:this.best,status:'playing',at:serverNow()}).catch(()=>{});
    try{ this.ref.onDisconnect().update({status:'left'}); }catch(e){} },
  score(v){ if(!this.ref) return; this.val=v; const send=()=>{ if(!this.ref) return; this.lastSent=Date.now(); this.ref.update({live:this.val,score:Math.max(this.best,this.val)}).catch(()=>{}); };
    clearTimeout(this.timer); if(Date.now()-this.lastSent>600) send(); else this.timer=setTimeout(send,600); },
  async end(g){ clearTimeout(this.timer);
    if(!this.ref){
      if(NET.db&&NET.room) return {ok:false};
      const l=store.get('local',[]); const k=l.findIndex(x=>x.id===pid()); const prev=k<0?0:l[k].score;
      const e={id:pid(),name:S.nick,char:S.char,score:Math.max(prev,g.score),right:g.right,total:g.total,status:'done'};
      if(k<0) l.push(e); else l[k]=e; store.set('local',l); notifyRank();
      return {ok:true,best:g.score>prev,prev,id:pid(),local:true}; }
    const prev=this.best, best=Math.max(prev,g.score), ref=this.ref; this.ref=null;
    try{ await ref.update({live:g.score,best,score:best,right:g.right,total:g.total,max:g.max,status:'done',at:serverNow()}); try{ ref.onDisconnect().cancel(); }catch(e){} return {ok:true,best:g.score>prev,prev,id:pid()}; }
    catch(e){ return {ok:false}; } },
  stop(){ clearTimeout(this.timer); if(this.ref){ this.ref.update({status:'left'}).catch(()=>{}); try{ this.ref.onDisconnect().cancel(); }catch(e){} } this.ref=null; }
};

function rankInto(el,big,limit,myId){
  if(!el) return;
  const list=rankList().slice(0,limit||10);
  const prev=el._pos||{}; const next={};
  const ol=document.createElement('ol'); ol.className='rk'+(big?' big':'');
  if(!list.length){ const li=document.createElement('li'); li.className='empty'; li.textContent=NET.room||!NET.db?'아직 기록이 없어요. 첫 번째 도전자가 되어 보세요!':'방 코드를 넣으면 친구들과 순위를 겨뤄요.'; ol.appendChild(li); }
  list.forEach((x,i)=>{
    const li=document.createElement('li'); li.dataset.id=x.id; if(i<3) li.classList.add('p'+(i+1)); if(myId&&x.id===myId) li.classList.add('me');
    const r=document.createElement('span'); r.className='r'; r.textContent=(i+1)+'위';
    const sp=spriteCanvas(CHARS[x.char]?x.char:'chick', x.status==='playing'?'happy':(i===0?'cool':'normal'));

    if(x.status==='playing'){ const g=document.createElement('span'); g.className='live'; g.textContent='플레이 중'; n.appendChild(g); }
    if(big&&i<3){ const g=document.createElement('span'); g.className='gift'; g.textContent='선물'; n.appendChild(g); }
    li.append(r,sp,n);
    if(big){ const a=document.createElement('span'); a.className='acc'; a.textContent=x.total!=null&&x.status!=='playing'?`${x.right}/${x.total}`:''; li.appendChild(a); }
    const s=document.createElement('span'); s.className='s'; s.textContent=x.score; li.appendChild(s);
    ol.appendChild(li);
  });
  el.replaceChildren(ol);
  // slide rows from their old place to the new one so overtakes are visible
  ol.querySelectorAll('li[data-id]').forEach(li=>{ const id=li.dataset.id, top=li.offsetTop; next[id]=top;
    if(prev[id]!=null && prev[id]!==top && !RM){ li.style.transform=`translateY(${prev[id]-top}px)`; if(prev[id]>top) li.classList.add('up');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ li.style.transition='transform .6s steps(8)'; li.style.transform=''; })); } });
  el._pos=next;
}

/* =================== PIXEL BOMB =================== */
function BombView(cv){
  const ctx=cv.getContext('2d'); let W=0,H=0,U=6, state='idle', p=1, t0=0, raf=0, embers=[], parts=[], dead=false, gold=false;
  const C=n=>CSS(n);
  function size(){ const r=cv.getBoundingClientRect(); const dpr=Math.min(2,devicePixelRatio||1); W=Math.max(200,Math.round(r.width)); H=Math.round(r.height)||150; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); U=Math.max(4,Math.floor(H/24)); }
  size(); const ro=new ResizeObserver(size); ro.observe(cv);
  const px=(i,j,col)=>{ ctx.fillStyle=col; ctx.fillRect(Math.round(i)*U,Math.round(j)*U,U,U); };
  const cols=()=>Math.floor(W/U), rows=()=>Math.floor(H/U);
  function drawBomb(ox,oy,body,face){
    const cx=ox+8.5, cy=oy+12, R=7.6;
    for(let j=-8;j<=8;j++) for(let i=-8;i<=8;i++){ const d=Math.hypot(i,j); if(d<=R+.5) px(cx+i,cy+j,d>R-.6?'#000':body); }
    [[-4,-4],[-3,-4],[-4,-3],[-5,-2]].forEach(([i,j])=>px(cx+i,cy+j,C('--cream')));
    for(let j=-11;j<=-8;j++) for(let i=2;i<=6;i++) px(cx+i,cy+j,(i===2||i===6||j===-11)?'#000':C('--silver'));
    if(face==='happy'){ [[-3,0],[3,0]].forEach(([i,j])=>{ px(cx+i-1,cy+j+1,'#000'); px(cx+i,cy+j,'#000'); px(cx+i+1,cy+j+1,'#000'); }); [[-3,3],[-2,4],[-1,4],[0,4],[1,4],[2,4],[3,3]].forEach(([i,j])=>px(cx+i,cy+j,'#000')); }
    if(face==='scared'){ [[-3,0],[3,0]].forEach(([i,j])=>{ px(cx+i,cy+j-1,'#000'); px(cx+i,cy+j,'#000'); }); for(let i=-1;i<=1;i++){ px(cx+i,cy+4,'#000'); px(cx+i,cy+3,'#000'); } }
    if(face==='calm'){ [[-3,0],[3,0]].forEach(([i,j])=>{ px(cx+i,cy+j,'#000'); px(cx+i,cy+j+1,'#000'); }); }
    return {capX:cx+4, capY:cy-12};
  }
  const fuseLen=(cap,frac)=>Math.max(3,(cols()-cap.capX-8)*frac);
  function drawFuse(cap,len){ let ly=cap.capY; for(let k=0;k<len;k++){ const j=cap.capY+Math.round(Math.sin(k/4)*1.2); px(cap.capX+k,j,k%3===0?C('--brown'):C('--peach')); ly=j; } return [cap.capX+len,ly]; }
  function frame(t){
    if(dead) return; raf=requestAnimationFrame(frame);
    ctx.clearRect(0,0,W,H);
    const tt=(t-t0)/1000, ox=2, oy=Math.max(0,rows()-21);
    const base = gold ? C('--yellow') : C('--slate');
    if(state==='idle'||state==='burn'){
      const scared=state==='burn'&&p<.35, blink=scared&&Math.floor(t/160)%2===0;
      const jit=scared?(Math.random()<.5?-1:1)*(Math.random()<.6?1:0):0;
      const cap=drawBomb(ox+jit,oy,blink?C('--orange'):base,scared?'scared':'calm');
      const [ex,ey]=drawFuse(cap,fuseLen(cap,state==='idle'?1:p));
      if(state==='burn'){ const pal=[C('--yellow'),C('--orange'),C('--cream')];
        for(let k=0;k<7;k++) px(ex+Math.round((Math.random()-.5)*3),ey+Math.round((Math.random()-.5)*3),rand(pal)); px(ex,ey,C('--cream'));
        if(Math.random()<.5) embers.push({x:ex,y:ey,vx:(Math.random()-.3)*.5,vy:-Math.random()*.6-.1,l:14,c:rand(pal)}); }
    }
    if(state==='safe'){
      const hop=tt<1.1?Math.round(Math.abs(Math.sin(tt*Math.PI*2.2))*4):0;
      const cap=drawBomb(ox,oy-hop,C('--blue'),'happy');
      const [ex,ey]=drawFuse(cap,3);
      if(tt<1.2){ for(let k=0;k<5;k++){ const r=tt*6+k; px(ex+2+Math.round(Math.cos(k*1.3)*r*.4),ey-Math.round(r*.7)-k,k%2?C('--silver'):C('--lav')); } }
      if(tt<1.6) for(let k=0;k<6;k++){ const a=k/6*6.283+tt*2, r=11+Math.min(6,tt*10); const sx=ox+8.5+Math.cos(a)*r, sy=oy+12-hop+Math.sin(a)*r*.75; const col=k%2?C('--yellow'):C('--green'); px(sx,sy,col); px(sx+1,sy,col); px(sx-1,sy,col); px(sx,sy+1,col); px(sx,sy-1,col); }
      if(tt>.15){ const s=Math.min(1,(tt-.15)*5); ctx.save(); ctx.font=`${Math.round(H*.36*s)}px "Do Hyeon", sans-serif`; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText('해제 성공!',(ox+26)*U+4,H/2+4); ctx.fillStyle=C('--green'); ctx.fillText('해제 성공!',(ox+26)*U,H/2); ctx.restore(); }
    }
    if(state==='boom'){
      // a soft, contained cartoon "pop": grey smoke puffs and a sooty bomb, no full-screen colour
      const cx=ox+8.5, cy=oy+12;
      if(tt<.25){ const r=3+tt*30; for(let a=0;a<6.283;a+=1/(r+1)) px(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.75,C('--orange')); }
      const puffs=[[0,0,5],[-6,-3,3.5],[6,-4,3.5],[-4,4,3],[5,4,3]];
      const grow=Math.min(1,tt*3), fade=tt>1.2?Math.max(0,1-(tt-1.2)*1.5):1;
      ctx.globalAlpha=fade;
      puffs.forEach(([dx,dy,r])=>{ const rr=r*grow; for(let j=-Math.ceil(rr);j<=rr;j++) for(let i=-Math.ceil(rr);i<=rr;i++) if(i*i+j*j<=rr*rr) px(cx+dx+i,cy+dy+j-tt*2,(i+j)%3===0?C('--silver'):C('--lav')); });
      ctx.globalAlpha=1;
      if(tt>.8){ const cap=drawBomb(ox,oy,'#2a2a2a','calm'); px(cap.capX,cap.capY,C('--slate')); for(let k=0;k<3;k++) px(cx-3+k*3,cy-2,'#fff'); }
      if(tt>.1&&tt<1.6){ const s=Math.min(1,tt*5); ctx.save(); ctx.font=`${Math.round(H*.4*s)}px "Do Hyeon", sans-serif`; ctx.textBaseline='middle'; ctx.fillStyle='#000'; ctx.fillText('펑!',(ox+26)*U+4,H/2+4); ctx.fillStyle=C('--orange'); ctx.fillText('펑!',(ox+26)*U,H/2); ctx.restore(); }
    }
    embers=embers.filter(e=>(e.l--)>0); embers.forEach(e=>{ e.x+=e.vx; e.y+=e.vy; px(e.x,e.y,e.c); });
  }
  raf=requestAnimationFrame(frame);
  return { burn(isGold){ state='burn'; p=1; gold=!!isGold; }, set(v){ p=v; }, safe(){ state='safe'; t0=performance.now(); embers=[]; }, boom(){ state='boom'; t0=performance.now(); embers=[]; }, idle(){ state='idle'; p=1; }, stop(){ dead=true; cancelAnimationFrame(raf); ro.disconnect(); } };
}

    const ranked=teams.slice().sort((a,b)=>b.score-a.score);
    app.innerHTML=`<section class="res"><div class="why">모둠 배틀 결과</div><div class="who">${esc(ranked[0].name)} 우승!</div>
      <div class="px box" style="max-width:600px;width:100%"><ol class="rk big">${ranked.map((t,i)=>`<li class="${i<3?'p'+(i+1):''}"><span class="r">${i+1}위</span><span></span><span class="n">${esc(t.name)}</span><span></span><span class="s">${t.score}</span></li>`).join('')}</ol></div>
      <div class="ctrl"><button class="pbtn red" id="again">같은 모둠으로 한 판 더</button><button class="pbtn dark" id="toHome">메인으로</button></div></section>`;
    $('#again').onclick=teamRun; $('#toHome').onclick=home; sfx.record(); fx.rain(220); banner('WINNER!','',1500); scrollTo(0,0); }
  cur={stop(){ cancelAnimationFrame(raf); }};
  keyHandler=e=>{ if(e.key==='Enter'){ e.preventDefault(); phase==='ask'?reveal():nextQ(); } };
  render(); scrollTo(0,0);
}

/* =================== MATCH =================== */
function matchSetup(){
  cleanup(); playSong('menu');
  app.innerHTML=`<section class="px panelbox"><h2 class="h" style="font-size:2.4rem">짝 맞추기</h2>
    <p>카드를 두 장씩 뒤집어 낱말과 그 뜻을 짝지어요. 대결 모드에서는 짝을 맞히면 한 번 더, 틀리면 상대 모둠 차례!</p>
    <div class="row"><span class="lbl">짝의 수</span>${[4,6,8,10].map(n=>`<button class="chip" data-p="${n}" aria-pressed="${S.pairs===n}">${n}쌍</button>`).join('')}</div>
    <div class="row"><span class="lbl">방식</span><button class="chip" data-m="1" aria-pressed="${S.matchTeams===1}">혼자 도전</button><button class="chip" data-m="2" aria-pressed="${S.matchTeams===2}">두 모둠 대결</button></div>
    <div class="ctrl" style="justify-content:flex-start"><button class="pbtn" id="start">카드 섞기</button><button class="pbtn dark" id="back">메인으로</button></div></section>`;
  $$('[data-p]').forEach(b=>b.onclick=()=>{ S.pairs=+b.dataset.p; save(); sfx.click(); matchSetup(); });
  $$('[data-m]').forEach(b=>b.onclick=()=>{ S.matchTeams=+b.dataset.m; save(); sfx.click(); matchSetup(); });
  $('#back').onclick=home; $('#start').onclick=matchRun; scrollTo(0,0);
}
function matchRun(){
  cleanup(); playSong(null); inGame=true;
  const n=S.pairs, picked=[]; for(const c of shuffle(D)){ if(picked.length>=n) break; if(picked.some(p=>isLinked(p.w,c.w))) continue; picked.push(c); }
  const cards=shuffle(picked.flatMap(c=>[{id:c.n,k:'w',text:c.w,c},{id:c.n,k:'d',text:c.d,c}]));
  const vs=S.matchTeams===2, sc=[0,0], tn=[S.teamNames[0]||'1모둠',S.teamNames[1]||'2모둠']; let turn=0,open=[],moves=0,found=0,lock=false; const t0=Date.now();
  const status=()=>vs?`<div class="board">${[0,1].map(i=>`<div class="px team ${turn===i?'turn':''}"><span class="nm">${esc(tn[i])}${turn===i?' 차례':''}</span><span class="tsc">${sc[i]}</span></div>`).join('')}</div>`:`<div class="statline"><span>찾은 짝 <b>${found}/${n}</b></span><span>뒤집은 횟수 <b>${moves}</b></span></div>`;
  app.innerHTML=`<section id="stage"><div id="st">${status()}</div>
    <div class="mgrid" style="--cols:${n===10?5:4}">${cards.map((k,i)=>`<button class="px mc ${k.k}" data-i="${i}" aria-label="카드 ${i+1}"><span class="face">?</span><span class="txt">${esc(k.text)}</span></button>`).join('')}</div>
    <div class="px feed" id="feed"></div>
    <div class="ctrl" style="margin-top:12px"><button class="pbtn dark" id="re">새로 섞기</button><button class="pbtn dark" id="back">메인으로</button></div></section>`;
  $('#back').onclick=home; $('#re').onclick=matchRun;
  const els=$$('.mc');
  els.forEach(el=>el.onclick=()=>{
    const i=+el.dataset.i; if(lock||el.classList.contains('open')||el.classList.contains('done')) return;
    el.classList.add('open'); sfx.flip(); open.push(i);
    if(open.length===2){ moves++; const [a,b]=open.map(j=>cards[j]);
      if(a.id===b.id&&a.k!==b.k){ open.forEach(j=>{ els[j].classList.remove('open'); els[j].classList.add('done','t'+(vs?turn:0)); els[j].disabled=true; }); found++; if(vs) sc[turn]++;
        sfx.correct(found); const [x,y]=centerOf(els[open[1]]); fx.burst(x,y,40); open=[];
        $('#feed').className='px feed ok'; $('#feed').innerHTML=`<div><b>${esc(a.c.w)}</b> ${esc(a.c.d)}</div>`;
        if(found===n) setTimeout(()=>{ if($('#st')) end(); },700);
      } else { lock=true; sfx.oops(); setTimeout(()=>{ if(!$('#st')) return; open.forEach(j=>els[j].classList.remove('open')); open=[]; lock=false; if(vs) turn=1-turn; $('#st').innerHTML=status(); },1200); }
      $('#st').innerHTML=status(); }
  });
  function end(){ const s=Math.round((Date.now()-t0)/1000);
    const head=vs?(sc[0]===sc[1]?'무승부!':`${esc(tn[sc[0]>sc[1]?0:1])} 승리!`):`${moves}번 만에 완성!`;
    app.innerHTML=`<section class="res"><div class="why">짝 맞추기 · ${Math.floor(s/60)}분 ${s%60}초</div><div class="who">${head}</div>${vs?`<p style="font-size:1.3rem">${esc(tn[0])} ${sc[0]}쌍 · ${esc(tn[1])} ${sc[1]}쌍</p>`:''}
      <div class="px box" style="width:100%;text-align:left"><h3 class="h">이번 판 낱말</h3><div class="wl">${picked.map(c=>`<div><b>${esc(c.w)}</b> ${esc(c.d)}</div>`).join('')}</div></div>
      <div class="ctrl"><button class="pbtn" id="again">한 판 더</button><button class="pbtn dark" id="toHome">메인으로</button></div></section>`;
    $('#again').onclick=matchRun; $('#toHome').onclick=home; sfx.record(); fx.rain(200); scrollTo(0,0); }
  scrollTo(0,0);
}

title();
netInit();
})();
</script>
</body>
