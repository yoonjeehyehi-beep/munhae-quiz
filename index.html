<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문해력 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
/* Layout: an 8-bit arcade cabinet — pixel-bordered panels on a night-blue screen, HUD with the player's character on top, one big question box, 2x2 answer pads. 16-colour fantasy-console palette. */
:root{
  color-scheme:dark;
  --night:#0E1630; --navy:#1D2B53; --navy2:#2A3D73; --black:#000000;
  --plum:#7E2553; --forest:#008751; --brown:#AB5236; --slate:#5F574F; --silver:#C2C3C7; --cream:#FFF1E8;
  --red:#FF004D; --orange:#FFA300; --yellow:#FFEC27; --green:#00E436; --blue:#29ADFF; --lav:#83769C; --pink:#FF77A8; --peach:#FFCCAA;
  --f-ui:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"Press Start 2P","Courier New",monospace;
  --u:4px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);background-image:radial-gradient(var(--navy2) 1.2px,transparent 1.6px);background-size:26px 26px;color:var(--cream);font-family:var(--f-ui);font-size:20px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden}
body.fever{background-color:#2A0F3E}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--yellow);outline-offset:4px}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 20px;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
canvas.sp{image-rendering:pixelated;display:block}

/* pixel frame: four hard shadows draw a black border with notched corners */
.px{background:var(--navy);margin:var(--u);box-shadow:0 calc(-1*var(--u)) 0 0 #000,0 var(--u) 0 0 #000,calc(-1*var(--u)) 0 0 0 #000,var(--u) 0 0 0 #000,inset 0 calc(-1*var(--u)) 0 0 rgba(0,0,0,.35),inset 0 var(--u) 0 0 rgba(255,255,255,.12)}
.pbtn{--c:var(--yellow);--t:#000;border:0;background:var(--c);color:var(--t);font-family:var(--f-ui);font-size:1.4rem;padding:10px 24px 12px;margin:var(--u);
  box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 -4px 0 0 rgba(0,0,0,.3),inset 0 4px 0 0 rgba(255,255,255,.45),0 8px 0 0 #000;transition:transform .05s}
.pbtn:hover{filter:brightness(1.08)}
.pbtn:active{transform:translateY(4px)}
.pbtn.red{--c:var(--red);--t:var(--cream)}.pbtn.blue{--c:var(--blue)}.pbtn.green{--c:var(--green)}.pbtn.dark{--c:var(--navy2);--t:var(--cream)}
.pbtn.sm{font-size:1.1rem;padding:6px 14px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.h{font-family:var(--f-ui);color:var(--yellow);text-shadow:3px 3px 0 #000;margin:0;font-weight:400;line-height:1.15}

header.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-bottom:12px}
header.top[hidden]{display:none}
.homeb{background:none;border:0;padding:0;font-size:2rem;color:var(--yellow);text-shadow:0 3px 0 var(--orange),0 6px 0 #000;line-height:1.1}
.sp1{flex:1}
.tog{border:0;background:var(--navy);color:var(--silver);font-size:1.05rem;padding:5px 14px;margin:var(--u);box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000}
.tog[aria-pressed="true"]{color:#000;background:var(--green)}
footer.lib{text-align:center;padding:28px 0 8px;color:var(--silver);font-size:1.15rem;letter-spacing:.08em}

/* title */
.title{display:grid;place-items:center;text-align:center;min-height:76vh}
.title .in{display:grid;gap:22px;justify-items:center;width:100%}
.logo{font-family:var(--f-ui);font-size:clamp(4.4rem,16vw,10.5rem);line-height:1;color:var(--yellow);letter-spacing:.02em;margin:0;font-weight:400;
  text-shadow:0 .05em 0 var(--orange),0 .1em 0 var(--red),0 .15em 0 var(--plum),0 .2em 0 #000;padding-bottom:.2em}
.title .tag{color:var(--peach);font-size:1.6rem}
.press{font-family:var(--f-num);font-size:1.15rem;padding:18px 30px}
.hint{color:var(--silver);font-size:1.1rem}
.parade{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.parade canvas{width:72px;height:72px;animation:hop 1s steps(2) infinite}
.parade canvas:nth-child(2n){animation-delay:.25s}.parade canvas:nth-child(3n){animation-delay:.5s}
@keyframes hop{50%{transform:translateY(-12px)}}

/* home */
.player{padding:16px 18px;display:grid;gap:14px;margin-bottom:20px}
.prow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prow label,.prow .lab{font-size:1.5rem;color:var(--yellow);min-width:3.2em}
#nick{font:inherit;font-size:1.6rem;padding:8px 14px;border:0;background:#000;color:var(--cream);width:min(14em,100%);box-shadow:inset 0 0 0 4px var(--lav)}
#nick:focus{box-shadow:inset 0 0 0 4px var(--yellow);outline:0}
.need{color:var(--pink);font-size:1.15rem}
.chars{display:flex;gap:8px;flex-wrap:wrap}
.chr{border:0;background:var(--night);padding:6px 6px 2px;display:grid;justify-items:center;font-size:1rem;color:var(--silver);box-shadow:inset 0 0 0 4px var(--navy2)}
.chr canvas{width:60px;height:60px}
.chr[aria-pressed="true"]{background:var(--navy2);color:var(--yellow);box-shadow:inset 0 0 0 4px var(--yellow)}
.chr[aria-pressed="true"] canvas{animation:hop .8s steps(2) infinite}
.homegrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.gamecol{display:grid;gap:20px}
.gcard{border:0;text-align:left;padding:20px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:18px;align-items:start;width:calc(100% - 8px)}
.gcard canvas{width:110px;height:110px}
.gcard .gt{font-size:2.6rem;line-height:1.05;color:var(--cream);text-shadow:4px 4px 0 #000}
.gcard p{margin:6px 0 10px;color:var(--cream);font-size:1.2rem;line-height:1.45;opacity:.92}
.gcard .badge{display:inline-block;font-size:1.05rem;padding:2px 10px;margin-bottom:6px;color:#000}
.fun{display:flex;flex-wrap:wrap;gap:6px}
.fun span{font-size:1rem;background:rgba(0,0,0,.35);padding:2px 10px;color:var(--yellow)}
.gcard.g1{background:var(--plum)}.gcard.g1:hover{background:#953064}
.gcard.g2{background:var(--forest)}.gcard.g2:hover{background:#079A5E}
.gcard[aria-disabled="true"]{filter:grayscale(.6) brightness(.8)}
.extras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.extra{border:0;text-align:left;padding:12px 14px;font-size:1.4rem;display:grid;gap:2px}
.extra small{color:var(--silver);font-size:1.02rem}
.extra:disabled{opacity:.5;cursor:default}
.extra:not(:disabled):hover{background:var(--navy2)}
.rankpanel{padding:16px 18px}
.rankpanel .h{font-size:1.9rem;margin-bottom:12px}
.netline{font-size:1.05rem;color:var(--silver);margin-top:12px}
.rk{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.rk li{display:grid;grid-template-columns:3em 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 12px;background:var(--night);font-size:1.3rem}
.rk li canvas{width:36px;height:36px}
.rk .r{font-size:1.2rem;color:var(--silver)}
.rk .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .s{font-family:var(--f-num);font-size:.9rem;color:var(--yellow)}
.rk li.p1{background:var(--yellow);color:#000}.rk li.p2{background:var(--silver);color:#000}.rk li.p3{background:var(--peach);color:#000}
.rk li.p1 .r,.rk li.p1 .s,.rk li.p2 .r,.rk li.p2 .s,.rk li.p3 .r,.rk li.p3 .s{color:#000}
.rk li.me{box-shadow:inset 0 0 0 4px var(--green)}
.rk .empty{background:none;color:var(--silver);display:block;padding:6px 0;font-size:1.15rem}
.rk.big li{grid-template-columns:3.4em 48px minmax(0,1fr) auto auto;font-size:1.7rem;padding:8px 14px}
.rk.big li canvas{width:48px;height:48px}
.rk.big .r{font-size:1.5rem}.rk.big .s{font-size:1.15rem}
.rk .acc{font-size:1.1rem;opacity:.75}
.gift{font-size:1rem;padding:0 8px;background:var(--red);color:var(--cream);margin-left:8px;vertical-align:middle}

/* HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding:10px 16px;margin-bottom:14px}
.hero{position:relative;display:flex;align-items:center;gap:10px}
.hero canvas{width:84px;height:84px}
.hero.jump canvas{animation:hop .3s steps(2) 3}
.hero.sad canvas{animation:sag .6s steps(3)}
@keyframes sag{50%{transform:translateY(8px) rotate(-6deg)}}
.bubble{position:relative;background:var(--cream);color:#000;font-size:1.25rem;padding:4px 12px;white-space:nowrap;box-shadow:0 -3px 0 0 #000,0 3px 0 0 #000,-3px 0 0 0 #000,3px 0 0 0 #000}
.bubble:empty{visibility:hidden}
.mid{display:grid;justify-items:center;gap:6px;min-width:0}
.clock{font-family:var(--f-num);font-size:clamp(2.2rem,6vw,3.2rem);color:var(--cream);text-shadow:4px 4px 0 #000;line-height:1}
.clock.low{color:var(--red);animation:blink .5s steps(2) infinite}
.tbar{width:min(100%,420px);height:18px;background:#000;padding:3px}
.tbar i{display:block;height:100%;background:var(--green);transform-origin:left}
.tbar.low i{background:var(--orange)}
.lvl{font-family:var(--f-num);font-size:1.05rem;color:var(--blue)}
.hearts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.hearts svg{width:34px;height:30px;shape-rendering:crispEdges}
.hearts .lost{opacity:.2}
.sc{text-align:right;font-family:var(--f-num)}
.sc small{display:block;font-size:.7rem;color:var(--silver);margin-bottom:6px}
.sc span{font-size:clamp(1.2rem,3.4vw,1.8rem);color:var(--yellow)}
.crow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.combo{font-family:var(--f-num);font-size:.85rem;color:var(--silver);min-width:9ch}
.combo.hot{color:var(--pink)}
.cm{flex:1 1 180px;min-width:140px;height:26px;background:#000;padding:4px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cm i{background:var(--navy2)}
.cm i.on{background:var(--pink)}
body.fever .cm i{background:var(--yellow);animation:blink .3s steps(2) infinite}
body.fever .cm i:nth-child(even){animation-delay:.15s;background:var(--orange)}
.fevertag{font-family:var(--f-num);font-size:.85rem;padding:6px 8px;background:var(--pink);color:#000;animation:blink .4s steps(2) infinite}
.chestbar{display:flex;align-items:center;gap:6px;font-size:1.1rem;color:var(--peach)}
.chestbar canvas{width:36px;height:30px}
.chestbar b{font-family:var(--f-num);font-size:.75rem;color:var(--yellow);font-weight:400}
.items{display:flex;gap:4px}
.item{border:0;background:var(--navy2);font-size:1.2rem;padding:5px 12px;margin:var(--u);box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000;display:flex;gap:8px;align-items:center}
.item b{font-family:var(--f-num);font-size:.7rem;background:var(--yellow);color:#000;padding:3px 5px}
.item:disabled{opacity:.4;cursor:default}

/* question */
.qbox{background:var(--cream);color:#000;padding:clamp(18px,3.5vw,32px);display:grid;gap:12px;min-height:200px;align-content:center;text-align:center;margin-bottom:20px}
.qbox.gold{background:var(--yellow);animation:gl .4s steps(2) infinite}
@keyframes gl{50%{background:var(--peach)}}
.qtag{justify-self:center;font-size:1.25rem;padding:2px 14px;background:#000;color:var(--yellow)}
.goldtag{justify-self:center;font-family:var(--f-num);font-size:.85rem;padding:6px 10px;background:var(--red);color:var(--cream)}
.prompt{font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.5;text-wrap:balance}
.prompt .w{font-size:1.6em;line-height:1.1;color:var(--plum)}
.prompt .sub2{display:block;font-size:.66em;color:var(--slate);margin-bottom:4px}
.blank{display:inline-block;min-width:3.2em;background:#000;color:var(--yellow);line-height:1.25;margin:0 3px;padding:0 8px}
.fill{background:var(--green);color:#000;padding:0 8px}
.fill.bad{background:var(--blue);color:#000}
.src{font-size:1.05rem;color:var(--slate)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opt{border:0;background:var(--navy);display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;font-size:clamp(1.55rem,3.2vw,2.1rem);min-height:82px;min-width:0;margin:var(--u);
  box-shadow:0 -4px 0 0 #000,0 4px 0 0 #000,-4px 0 0 0 #000,4px 0 0 0 #000,inset 0 -4px 0 0 rgba(0,0,0,.35),inset 0 4px 0 0 rgba(255,255,255,.12),0 8px 0 0 #000}
.opt.long{font-size:clamp(1.2rem,2.3vw,1.4rem);line-height:1.4}
.opt .n{flex:none;width:42px;height:42px;display:grid;place-items:center;font-family:var(--f-num);font-size:.95rem;color:#000;background:var(--blue)}
.opt:nth-child(2) .n{background:var(--yellow)}.opt:nth-child(3) .n{background:var(--pink)}.opt:nth-child(4) .n{background:var(--green)}
.opt:hover:not(:disabled){background:var(--navy2);transform:translateY(-4px)}
.opt:active:not(:disabled){transform:translateY(4px)}
.opt:disabled{cursor:default}
.opt.right{background:var(--green);color:#000;animation:hop .3s steps(2) 2}
.opt.wrong{background:var(--slate);color:var(--cream);animation:shk .3s steps(3)}
.opt.dim{opacity:.35}
.opt.gone{visibility:hidden}
@keyframes shk{33%{transform:translateX(-10px)}66%{transform:translateX(10px)}}
.feed{margin-top:18px;padding:12px 16px;min-height:70px;display:grid;gap:2px;align-content:center;font-size:1.35rem}
.feed:empty{visibility:hidden}
.feed b{color:var(--yellow);font-weight:400;font-size:1.55rem}
.feed .ex{color:var(--silver);font-size:1.2rem}
.feed .ex b{font-size:inherit;color:var(--cream)}
.feed.ok{background:#0B3B2A}.feed.bad{background:var(--navy2)}
.bombstage{position:relative;margin-bottom:14px;padding:6px}
.bombstage canvas{display:block;width:100%;height:170px;image-rendering:pixelated}
.fsec{position:absolute;right:18px;top:14px;font-family:var(--f-num);font-size:1.1rem;color:var(--cream)}

/* overlays */
.banner{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none;padding:16px;text-align:center}
.banner b{font-family:var(--f-ui);font-weight:400;font-size:clamp(4rem,14vw,9rem);line-height:1;color:var(--yellow);text-shadow:0 .05em 0 var(--orange),0 .1em 0 #000;animation:bn 1s steps(8) forwards}
.banner b.small{font-size:clamp(2.8rem,9vw,5.5rem)}
.banner b.blue{color:var(--blue);text-shadow:0 .05em 0 var(--navy2),0 .1em 0 #000}
.banner b.pink{color:var(--pink);text-shadow:0 .05em 0 var(--plum),0 .1em 0 #000}
.banner b.green{color:var(--green);text-shadow:0 .05em 0 var(--forest),0 .1em 0 #000}
.banner.stay b{animation:bnin .4s steps(4) forwards}
.banner .sub{display:block;font-size:.4em;color:var(--cream);margin-top:.2em}
@keyframes bn{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.1);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(1.1);opacity:0}}
@keyframes bnin{0%{transform:scale(.3)}100%{transform:scale(1)}}
.chestpop{position:fixed;inset:0;z-index:57;display:grid;place-items:center;pointer-events:none}
.chestpop .card{display:grid;justify-items:center;gap:6px;background:var(--navy);padding:18px 30px;box-shadow:0 -6px 0 0 #000,0 6px 0 0 #000,-6px 0 0 0 #000,6px 0 0 0 #000;animation:bnin .35s steps(4)}
.chestpop canvas{width:140px;height:116px}
.chestpop b{font-size:2.6rem;color:var(--yellow);text-shadow:3px 3px 0 #000;font-weight:400}
.chestpop span{font-size:1.4rem;color:var(--cream)}
.pop{position:fixed;z-index:56;pointer-events:none;transform:translate(-50%,-50%);font-family:var(--f-num);font-size:1.3rem;color:var(--yellow);text-shadow:3px 3px 0 #000;animation:pu 1s steps(10) forwards;white-space:nowrap}
.pop.t{font-family:var(--f-ui);font-size:1.9rem;color:var(--green)}
.pop.m{font-family:var(--f-ui);font-size:1.9rem;color:var(--orange)}
@keyframes pu{0%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-80px}}
.shake{animation:shake .35s steps(5)}
@keyframes shake{25%{transform:translate(-8px,4px)}50%{transform:translate(8px,-4px)}75%{transform:translate(-4px,2px)}}

/* results */
.res{display:grid;gap:18px;justify-items:center;text-align:center}
.res .why{font-family:var(--f-num);font-size:1rem;color:var(--silver)}
.reshead{display:flex;gap:20px;align-items:center;justify-content:center;flex-wrap:wrap}
.reshead canvas{width:120px;height:120px;animation:hop .8s steps(2) infinite}
.grade{font-family:var(--f-num);font-size:3.4rem;width:140px;height:140px;display:grid;place-items:center;color:#000}
.grade.C{background:var(--lav)}.grade.B{background:var(--blue)}.grade.A{background:var(--green)}.grade.S{background:var(--yellow)}.grade.SS{background:var(--pink)}
.res .who{font-size:clamp(2rem,6vw,3rem);line-height:1.1}
.res .ttl{color:var(--peach);font-size:1.5rem}
.bigscore{font-family:var(--f-num);font-size:clamp(2.2rem,8vw,3.6rem);color:var(--yellow);text-shadow:5px 5px 0 #000}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{padding:8px 16px;min-width:120px}
.stat small{display:block;color:var(--silver);font-size:1.1rem}
.stat b{font-family:var(--f-num);font-size:1rem;font-weight:400}
.saved{padding:12px 20px;font-size:1.6rem;background:var(--forest)}
.saved small{display:block;font-size:1.2rem;color:var(--peach)}
.codebox{padding:14px 20px;background:var(--plum);display:grid;gap:4px;justify-items:center;font-size:1.3rem}
.codebox .code{font-family:var(--f-num);font-size:clamp(1.6rem,7vw,2.4rem);color:var(--yellow);letter-spacing:.1em}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;width:100%;text-align:left}
.box{padding:16px 18px;min-width:0}
.box .h{font-size:1.6rem;margin-bottom:10px}
.wl{display:grid;gap:6px}
.wl div{background:var(--night);padding:8px 12px;font-size:1.2rem}
.wl b{color:var(--pink);font-weight:400}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* teacher */
.teach{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.qrbox{padding:20px;display:grid;gap:12px;justify-items:center;text-align:center}
.qrbox canvas{width:min(100%,360px);height:auto;aspect-ratio:1;image-rendering:pixelated;background:var(--cream)}
.qrbox .big{font-size:1.7rem;color:var(--yellow)}
.urlrow{display:flex;gap:6px;width:100%}
.urlrow input,.form input{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:6px 10px;border:0;background:#000;color:var(--cream);box-shadow:inset 0 0 0 3px var(--lav)}
.steps{margin:0;padding-left:1.3em;text-align:left;color:var(--silver);font-size:1.15rem;display:grid;gap:2px}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:center}
.form input{width:100%}
.msg{font-size:1.15rem;color:var(--peach);min-height:1.4em}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--pink);font-size:1.2rem}

/* team + match */
.panelbox{padding:22px 24px;display:grid;gap:16px;max-width:720px;margin:0 auto}
.panelbox p{margin:0;color:var(--silver);font-size:1.2rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{min-width:5em;color:var(--yellow);font-size:1.3rem}
.chip{border:0;background:#000;padding:4px 14px;font-size:1.25rem;margin:2px;box-shadow:inset 0 0 0 3px var(--lav)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#000;box-shadow:none}
select{font:inherit;font-size:1.2rem;padding:4px 8px;border:0;background:#000;color:var(--cream);box-shadow:inset 0 0 0 3px var(--lav)}
.tnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tnames input{font:inherit;font-size:1.2rem;padding:6px 10px;border:0;background:#000;color:var(--cream);box-shadow:inset 0 0 0 3px var(--lav);width:100%}
.board{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.team{flex:1 1 140px;min-width:0;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:1.4rem}
.team .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .tsc{font-family:var(--f-num);font-size:1.3rem;color:var(--yellow)}
.team .pm{display:flex;flex-direction:column;gap:2px}
.team .pm button{border:0;background:#000;width:28px;height:22px;padding:0;line-height:1}
.team.pick{cursor:pointer;background:var(--navy2)}
.team.sel{background:var(--forest)}
.team.turn{background:var(--plum)}
.timer{height:22px;background:#000;padding:4px;margin-bottom:12px}
.timer i{display:block;height:100%;background:var(--blue);transform-origin:left}
.timer.low i{background:var(--orange)}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cnt{font-family:var(--f-num);font-size:.9rem;color:var(--silver)}
.mgrid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px}
.mc{border:0;min-height:130px;padding:10px;display:grid;place-items:center;text-align:center;font-size:1.1rem;line-height:1.35;background:var(--plum)}
.mc .face{font-family:var(--f-num);font-size:1.8rem;color:var(--yellow)}
.mc .txt{display:none}
.mc.open,.mc.done{background:var(--cream);color:#000}
.mc.open .face,.mc.done .face{display:none}
.mc.open .txt,.mc.done .txt{display:block}
.mc.w .txt{font-size:1.8rem}
.mc.done{background:var(--green)}
.mc.done.t1{background:var(--pink)}
.statline{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:12px;font-family:var(--f-num);font-size:.85rem;color:var(--silver)}
.statline b{color:var(--yellow);font-weight:400}

.roomin{font:inherit;font-size:1.5rem;padding:6px 12px;border:0;background:#000;color:var(--yellow);width:7em;letter-spacing:.15em;text-transform:uppercase;box-shadow:inset 0 0 0 4px var(--lav)}
.roomin:focus{box-shadow:inset 0 0 0 4px var(--yellow);outline:0}
.roomcode{font-family:var(--f-num);font-size:clamp(2.4rem,7vw,3.6rem);color:var(--yellow);text-shadow:4px 4px 0 #000;letter-spacing:.12em;line-height:1.2}
.roomcode small{display:block;font-family:var(--f-ui);font-size:1.2rem;color:var(--silver);letter-spacing:0;text-shadow:none}
.warn{background:var(--plum);padding:10px 14px;font-size:1.15rem;text-align:left}
.waitnote{font-size:1.1rem;color:var(--green);margin-top:6px}
.racehead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.racehead .h{margin:0}
.raceclock{font-size:1.5rem;color:var(--green)}
.live{font-size:.95rem;padding:0 8px;background:var(--green);color:#000;margin-left:8px;vertical-align:middle;animation:blink 1s steps(2) infinite}
.rk li.up{box-shadow:inset 0 0 0 4px var(--green)}
.myrank{font-size:1.4rem;color:var(--yellow);min-height:1.4em}
.myrank.rup{animation:hop .3s steps(2) 3;color:var(--green)}
@media (max-width:860px){.homegrid,.teach,.two{grid-template-columns:1fr}.extras{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}}
@media (max-width:560px){
  body{font-size:18px}
  .opts{grid-template-columns:1fr;gap:10px}.opt{min-height:62px;font-size:1.5rem}.opt.long{font-size:1.15rem}
  .hud{grid-template-columns:auto minmax(0,1fr);gap:10px}.hud .sc{grid-column:1/-1;text-align:center}.hud .sc small{display:inline;margin-right:8px}
  .hero canvas{width:64px;height:64px}.bubble{font-size:1.05rem;padding:2px 8px}
  .gcard{grid-template-columns:72px minmax(0,1fr)}.gcard canvas{width:72px;height:72px}.gcard .gt{font-size:2.1rem}
  .mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.mc{font-size:.85rem;min-height:110px}
  .bombstage canvas{height:130px}.prompt{font-size:1.45rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="application/json" id="data">[{"n":1,"w":"구상하다","st":"구상","d":"앞으로 이루려는 일에 대하여 그 일의 내용이나 규모, 실현 방법 등을 어떻게 정할 것인지 이리저리 생각하다.","ex":"새로운 사업을 구상할 때는 시대의 흐름을 정확히 파악해야 한다.","cx":"현재 학생회는 5월에 열릴 학교 축제를 어떻게 진행할지 구상하고 있다. 다양한 프로그램을 구체적으로 계획하고 역할을 정하며 행사가 원활히 이루어지도록 노력하고 있다.","r":[{"t":"관련어","w":"구상도","d":"계획한 생각을 표현하는 바탕이 될 그림이나 도면.","s":"정확한 크기와 구조를 고려하여 구상도를 그렸다."},{"t":"관련어","w":"구상력","d":"전체의 짜임이나 순서 따위에 대하여 생각을 정리할 수 있는 능력.","s":"그의 작품은 구상력이 돋보인다."},{"t":"유의어","w":"상상하다","d":"실제로 경험하지 않은 현상이나 사물에 대하여 마음속으로 그려 보다.","s":"나는 10년 후의 나의 모습을 상상해 보았다."}]},{"n":2,"w":"보편적","st":"보편적","d":"모든 것에 두루 미치거나 통하는, 또는 그런 것.","ex":"도둑질을 하면 안 된다는 것은 어느 나라에서나 보편적인 규칙이다.","cx":"그는 전 세계 사람들이 공통적으로 느끼는 보편적인 감정이 있다고 보았다. 그리고 얼굴 표정을 연구한 결과, 여섯 가지 감정이 문화, 나이, 성별과 관계없이 나타난다고 주장하였다.","r":[{"t":"유의어","w":"일반적","d":"일부에 제한되지 않고 전체에 걸치는. 또는 그런 것.","s":"더우면 땀이 나는 것은 일반적인 현상이다."},{"t":"관련어","w":"보편화","d":"널리 사람들에게 퍼짐. 또는 그렇게 되게 함.","s":"휴대 전화의 보편화로 누구나 쉽게 연락할 수 있게 되었다."},{"t":"사회","w":"보편적 교육","d":"국민 또는 사회인으로서 갖추어야 할 기초적인 지식을 기르는 교육.","s":"보편적 교육은 누구에게나 배움의 기회를 주는 것을 목표로 한다."}]},{"n":3,"w":"개념","st":"개념","d":"어떤 사물이나 현상에 대한 일반적인 지식.","ex":"나는 선생님의 설명을 듣고 곱셈의 개념을 이해했다.","cx":"아기들은 세상에 대해 하나씩 배워 가는 과정에 있다. 아직 뜨거움에 대한 개념이 없어서 쉽게 손을 델 수 있으므로, 주위에 뜨거운 물건이 없도록 해야 한다.","r":[{"t":"도덕","w":"자아 개념","d":"자신와 다른 사람과의 관계에서 자신의 특징, 자신에 대한 생각 등을 스스로 이해하는 모습.","s":"긍정적인 자아 개념을 가지면 좀 더 자신감 있게 행동할 수 있다."},{"t":"관련어","w":"개념어","d":"추상적인 생각을 나타낸 말.","s":"이 책은 낯선 개념어들이 많이 나와 이해하는 데 시간이 걸린다."},{"t":"유의어","w":"관념","d":"어떤 일에 대한 견해나 생각.","s":"그는 시간에 대한 관념이 뚜렷해서 약속에 늦지 않는다."}]},{"n":4,"w":"개요","st":"개요","d":"간단하게 정리한 주요 내용.","ex":"우리는 보고서의 앞부분에 실험 과정의 개요를 적었다.","cx":"발표를 준비할 때는 전체적인 구조를 먼저 정리하는 과정이 필요하다. 이때 개요를 작성해 두면 복잡한 내용을 한눈에 정리할 수 있으며, 발표자가 전달하고자 하는 핵심 내용이 무엇인지가 분명히 드러난다.","r":[{"t":"관련어","w":"개요도","d":"대강의 중요한 구조나 내용 따위를 나타낸 그림.","s":"선생님께서 소설에 대한 학생들의 이해를 돕기 위해 개요도를 그리셨다."},{"t":"유의어","w":"골자","d":"말이나 일의 내용에서 중심이 되는 줄기를 이루는 것.","s":"나는 그가 이야기하는 내용의 주요 골자를 파악했다."},{"t":"유의어","w":"대의","d":"글이나 말의 대략적인 뜻.","s":"그는 책의 세부적인 내용은 잊었지만, 대의는 기억하고 있었다."}]},{"n":5,"w":"검증하다","st":"검증","d":"검사하여 증명하다.","ex":"과학자는 자신의 실험 결과 가 정확한지 다시 검증했다.","cx":"새로운 제품이 시장에 나오기 전에 거치는 중요한 과정 중 하나는 품질을 검증하는 것이다. 제품을 꼼꼼하게 검사해 제대로 작동하는지와 안전성을 확인한다. 이 과정을 통해 소비자에게 신뢰를 주고, 불량으로 인한 피해를 막을 수 있다.","r":[{"t":"기술·가정","w":"기술 검증","d":"어떤 기술이 목적에 맞게 제대로 작동하는지를 검사하여 증명하는 일.","s":"전 세계에서 첫 번째로 기술 검증을 통과하여 국내 기술의 우수성을 널리 알렸다."},{"t":"관련어","w":"미검증","d":"검사하여 증명하지 않음.","s":"미검증 자료를 그대로 사용하면 글의 신뢰성이 떨어진다."},{"t":"유의어","w":"논증하다","d":"옳고 그름을 이유를 들어 밝히다.","s":"그 학생은 글에서 주장한 내용을 여러 자료를 활용해 논증했다."}]},{"n":6,"w":"모순","st":"모순","d":"어떤 사실의 앞뒤, 또는 두 사실이 어긋나서 서로 맞지 않음을 이르는 말.","ex":"사람들에게 정직하라고 하면서 스스로 거짓말을 하는 것은 모순이다.","cx":"그는 규칙을 중요하게 생각한다고 말하면서도 종종 규칙을 어기는 모순을 보였다. 주변 사람들은 말과 행동이 어긋나 서로 맞지 않는 그의 태도를 보며 실망했다.","r":[{"t":"국어","w":"모순 표현","d":"의미상 동시에 올 수 없는 말을 함께 사용하는 것.","s":"‘소리 없는 아우성’은 대표적인 모순 표현이다."},{"t":"관련어","w":"모순적","d":"어떤 사실의 앞뒤, 또는 두 사실이 어긋나서 서로 맞지 않는. 또는 그런 것.","s":"그는 환경을 보호하자고 하면서도 일회용품을 많이 쓰는 모순적 태도를 보였다."},{"t":"유의어","w":"기술 검증","d":"어떤 기술이 목적에 맞게 제대로 작동하는지를 검사하여 증명하는 일.","s":"그 소설은 사회의 부조리를 사실적으로 드러내 독자들에게 큰 울림을 주었다."}]},{"n":7,"w":"반박하다","st":"반박","d":"어떤 의견이나 주장 등에 반대하여 말하다.","ex":"그는 상대의 주장이 잘못되 었다며 강하게 반박하였다.","cx":"학급 회의에서 한 학생이 자유롭게 자리에 앉을 것을 주장하였다. 그러자 다른 학생이 친한 친구들끼리 모여 앉으면 소란스러워질 수 있다며 그 주장을 반박하였다.","r":[{"t":"관련어","w":"반박문","d":"어떤 의견이나 주장 등에 반대하는 내용을 담은 글.","s":"반박문을 통해 상대방의 주장에 문제점이 있다는 것을 드러낼 수 있다."},{"t":"유의어","w":"반론","d":"다른 사람의 논설이나 비난, 논평 등에 대하여 반박함. 또는 그런 논설.","s":"토론에서 한 학생이 상대편의 주장에 대해 반론을 펼쳤다."},{"t":"동형이의어","w":"반박","d":"한 박자의 반.","s":"이 부호는 반박을 쉬고 부르라는 표시다."}]},{"n":8,"w":"반영하다","st":"반영","d":"어떤 것에 영향을 받아 그것을 나타내다.","ex":"이 영화는 시대적 상황을 생생하게 반영하고 있다.","cx":"학급 대표들은 학생회에 현재 급식 순서의 문제점을 전달했다. 그 영향으로 학생들의 의견을 반영한 규칙이 새롭게 마련되었고, 모두가 만족할 수 있는 방향으로 바뀌었다는 평가를 받았다.","r":[{"t":"국어","w":"반영론적 관점","d":"문학 작품이 시대 현실을 나타내고 있다고 보는 작품 해석의 관점.","s":"반영론적 관점은 문학 작품 속에 담긴 사회적 배경과 현실에 주목한다."},{"t":"관련어","w":"반영 폭","d":"다른 것에 영향을 받아 어떤 현상이 나타나는 범위.","s":"올해부터 수행평가의 반영 폭이 넓어져 다양한 활동이 점수에 포함된다."},{"t":"유의어","w":"영향","d":"어떤 사물의 효과나 작용이 다른 것에 미치는 일.","s":"스마트폰은 우리의 생활에 큰 영향을 주고 있다."}]},{"n":9,"w":"변동","st":"변동","d":"바뀌어 달라짐.","ex":"계획에 변동이 생기면서 행사가 하루 미뤄졌다.","cx":"채소나 과일은 계절과 날씨에 따라 값이 달라진다. 예를 들어 여름에는 수박값이 내려가고 겨울에는 올라간다. 이러한 가격 변동은 사람들이 물건을 살 때 중요한 기준이 된다.","r":[{"t":"과학","w":"지각 변동","d":"지구 내부의 원인 때문에 생기는 지각의 흔들림과 달라짐. 사회 변동: 한 사회의 전반적인 생활 방식, 가치관, 제도, 기술 등이 변화하는 것.","s":"지각 변동으로 화산 폭발과 지진이 일어나기도 한다."},{"t":"유의어","w":"변경","d":"다르게 바꾸어 새롭게 고침.","s":"비가 많이 와서 여행 일정의 변경이 필요했다."}]},{"n":10,"w":"서술하다","st":"서술","d":"사건이나 생각을 차례대로 말하거나 적다.","ex":"기행문은 여행한 과정에서 보고 듣고 느낀 바를 서술한 글이다.","cx":"그 작가는 짧은 문장으로도 장면을 명확히 서술했다. 덕분에 독자들은 마치 그 자리에 있는 듯한 느낌을 받았다.","r":[{"t":"국어","w":"서술어","d":"한 문장에서 주어의 움직임, 상태, 성질을 설명하는 말.","s":"문장을 쓸 때는 주어와 서술어를 제대로 맞추어야 한다."},{"t":"유의어","w":"기술하다","d":"대상이나 과정의 내용과 특징을 있는 그대로 기록하다.","s":"역사는 사실을 기술하고 문학은 있을 수 있는 일을 지어낸다."}]},{"n":11,"w":"연쇄","st":"연쇄","d":"사물이나 현상이 사슬처럼 서로 이어져 하나를 이룸.","ex":"오늘 오후 고속 도로에서 차량 연쇄 추돌 사고가 발생했습니다.","cx":"작은 실수가 연쇄 작용을 일으켜 전체 시스템에 영향을 주었다. 꼬리를 물고 이어진 문제로 결국 회사는 하루 동안 모든 서비스를 중단해야 했다.","r":[{"t":"사회","w":"연쇄 반응","d":"어떤 하나의 사건을 계기로 하여 잇달아 관련된 사건이 일어나는 일.","s":"기름값이 오르면 각종 비용이 연쇄 반응을 보이며 함께 오른다."},{"t":"관련어","w":"연쇄적","d":"서로 연결되어 관련이 있는. 또는 그런 것.","s":"화산이 연쇄적으로 폭발하여 거대한 연기를 뿜어내고 있다."},{"t":"유의어","w":"연속","d":"끊이지 아니하고 이어지거나 지속함.","s":"비슷한 사건이 연속으로 일어났다."}]},{"n":12,"w":"비약","st":"비약","d":"지위나 수준이 갑자기 빠른 속도로 높아지거나 향상됨. 논리나 사고방식이 그 차례나 단계를 따르지 아니하고 뛰어넘음.","ex":"피겨 종목에서 한국의 비약은 세계적인 화제였다.","cx":"그 소설은 사건 전개가 너무 급해서 내용의 연결이 매끄럽지 않고 비약이 많다는 평을 받았다. 독자들도 소설의 흐름을 이해하기 어려웠을 것이다.","r":[{"t":"관련어","w":"비약적","d":"지위나 수준이 갑자기 빠른 속도로 높아지거나 향상되는 것.","s":"그녀의 영어 실력이 한 학기 만에 비약적으로 향상되었다."},{"t":"유의어","w":"급진","d":"서둘러 급히 나아감. 목적이나 이상을 급히 실현하고자 함.","s":"그는 기존 체제를 무너뜨리려는 급진 세력의 지도자로 떠올랐다."},{"t":"유의어","w":"도약","d":"몸을 위로 솟구치는 일. 더 높은 단계로 발전하는 것.","s":"개발 도상국에서 선진국으로의 도약은 쉽지 않은 일이다."}]},{"n":13,"w":"영구적","st":"영구적","d":"오래도록 변하지 아니하는 것.","ex":"환경 오염은 지구에 영구적인 피해를 가져올 수 있다.","cx":"큰 교통사고는 피해자에게 영구적인 장애를 남겼다. 그래서 그는 평생 재활 치료를 계속할 :"둘 이상의 것이 합쳐져서 하나가 되다. 또는 그렇게 만들다.","s":"만화 영화에서는 작은 로봇이 더 큰 로봇에 합체하는 장면이 자주 나온다."}]},{"n":23,"w":"의사","st":"의사","d":"무엇을 하고자 하는 생각.","ex":"이번 일은 그의 의사와는 상관없이 내 결정대로 밀고 나갈 것이다. 주말에는 영화를 보러 가야지!","cx":"이 중에서 어떤 역할을 할래? 망설이지 말고 너의 의사를 분명하게 밝히렴.","r":[{"t":"관련어","w":"의사소통","d":"가지고 있는 생각이나 뜻이 서로 통함.","s":"낯 선 나라를 여행할 때 가장 힘이 드는 점은 그 나라 언어를 모르고는 의사소통이 불가능하다는 것이다."},{"t":"관련어","w":"의사 결정","d":"자기의 생각을 명확하게 함.","s":"진로를 선택할 때에는 자신을 잘 아는 부모님, 선생님과 상담하고 전문가에게 도움을 구하는 등 알맞은 과정을 거쳐 의사 결정을 해야 한다."},{"t":"유의어","w":"견해","d":"어떤 사물이나 현상에 대한 자기의 의견이나 생각.","s":"교 실을 깨끗하게 사용하기 위해 내놓은 대책에 대해 학생들의 견해가 엇갈렸다."}]},{"n":24,"w":"의식적","st":"의식적","d":"어떤 것을 깨닫거나 알면서 일부러 하는 것.","ex":"우리는 의식적으로라도 올바른 우리말을 사용하려고 노력해야 한다. 목소리가 잘 들리도록 크게 말해야지!","cx":"나는 건강을 위해 의식적으로 물을 자주 마시고 있다.","r":[{"t":"사회","w":"목적 의식적","d":"자기 행위의 목적에 관해 뚜렷하게 깨닫고 의식하고 있는, 또는 그런 것.","s":"토론 대회를 준비하기 위한 다소 목적 의식적인 만남이었지만, 우리는 그동안 함께한 시간을 통해 서로 없어서는 안 될 든든한 친구가 되었다."},{"t":"유의어","w":"의도적","d":"무엇을 하려고 꾀하는 것.","s":"이번 화재는 누군가가 의도적으로 불을 지른 것 같다."},{"t":"반의어","w":"무의식적","d":"어떤 것을 깨닫거나 의식하지 못한 상태에서 자연스레 나오는 것.","s":"그녀는 도망치는 소매치기의 발목을 무의식적으로 걸었다."}]},{"n":25,"w":"이상적","st":"이상적","d":"생각할 수 있는 범위 안에서 가장 완전하다고 여겨지는 것.","ex":"도덕은 우리에게 인간다운 삶의 방향을 알려주고 이상적인 사회의 모습을 보여 주는 안내자 역할을 합니다.","cx":"그는 운동을 많이 해서 균형이 잘 잡힌 이상적인 신체를 가지고 있다.","r":[{"t":"철학","w":"이상주의","d":"인생의 의미를 오로지 이상, 특히 도덕적·사회적 이상을 이루는 데에 두는 태도.","s":"대다수는 순수한 이상주의를 외치며 변화를 꿈꾸는 청년들이었다."},{"t":"관련어","w":"이상향","d":"인간이 생각할 수 있는, 가장 좋은 상태를 갖춘 완전한 사회.","s":"현실에 지친 사람들은 이상향을 꿈꾸기 마련이다."},{"t":"반의어","w":"현실","d":"현재 실제로 존재하는 사실이나 상태.","s":"고향에 돌아온 그는 비로소 처참한 농촌 현실을 바로 볼 수 있었다."}]},{"n":26,"w":"이성","st":"이성","d":"어떤 사물에 대한 일반적인 뜻이나 내용과 관련하여 생각하는 능력. 감각적 능력에 맞대어 이르는 말.","ex":"아이가 없어졌다는 소식에 그녀는 이성을 잃고 아이의 이름만 불러 댔다. 감성 vs 이성","cx":"그는 감성보다는 이성이 발달한 냉철한 인간이다.","r":[{"t":"관련어","w":"이성적","d":"이성에 따르거나 이성에 근거한 것.","s":"흥분해 있을 때는 이성적인 판단을 하기 어렵다."},{"t":"동형이의어","w":"이성","d":"성별이 다른 것. 남성 쪽에선 여성을, 여성 쪽에선 남성을 가리킨다.","s":"준영이는 사춘기에 접어들면서 이성에 관심을 가지게 되었는지 요즘 부쩍 외모에 신경을 쓴다."}]},{"n":27,"w":"이의","st":"이의","d":"다른 의견이나 논의.","ex":"모든 일에 단 하나도 이의가 없는 사회는 정상적인 사회라고 보기 어렵다.","cx":"학급 회의 결과에 대부분이 찬성했지만, 나는 이의가 있었다.","r":[{"t":"유의어","w":"이견","d":"어떠한 의견에 대한 다른 의견. 또는 서로 다른 의견.","s":"양쪽의 이견을 좁히지 못해 회의는 계속해서 길어졌다."},{"t":"유의어","w":"반론","d":"남의 의견이나 주장, 비난 따위에 대하여 반대하여 말함. 또는 그런 주장.","s":"환 경 보호를 위해 공장을 줄이자는 주장에 대해 많은 사람들이 반론을 내놓았다."},{"t":"반의어","w":"동의","d":"같은 의견이나 논의.","s":"미 성년자에 대한 의료 행위는 대부분 보호자의 동의를 필요로 합니다."}]},{"n":28,"w":"추론","st":"추론","d":"이미 알고 있는 지식을 바탕으로 생각하여 판단함.","ex":"검은 구름과 갑작스러운 바람을 근거로 한 지수의 추론은 곧 비가 온다는 것이었다.","cx":"네 추론이 맞는 것 같아. 어떤 결과가 나왔을 때 그 결과를 긍정적으로 바라보면 우리가 조금 더 행복해질 수 있다는 거지. 그냥 메달을 딴 선수들 이야기라고만 생각했는데 그런 의도가 숨어 있었구나.","r":[{"t":"관련어","w":"추론력","d":"판단, 추리 등을 계속함으로써 대상을 이해하는 능력.","s":"실험 결과를 보고 원인을 짐작하는 데 추론력이 도움이 된다."},{"t":"유의어","w":"추리","d":"알고 있는 것을 바탕으로 알지 못하는 것을 미루어서 생각함.","s":"내 추리는 완전히 빗나가고 말았다."},{"t":"반의어","w":"직관","d":"경험, 판단 등을 거치지 않고 사물을 직접적으로 파악하는 것.","s":"그는 문제를 풀지 않고 직관으로 답을 골랐다."}]},{"n":29,"w":"확산","st":"확산","d":"흩어져 널리 퍼짐.","ex":"스마트폰 보급의 확산으로 전 세계의 소통 방식과 생활 습관이 빠르게 변화하고 있다.","cx":"산불의 확산을 막기 위해 소방관들이 밤새 진화 작업을 이어 갔지만, 거센 바람 때문에 불길이 주변 산으로 빠르게 번져 나갔다.","r":[{"t":"관련어","w":"확산적 질문","d":"어떤 문제에 대하여 단순한 대답이 아닌 다양한 대답이 이어져 나오도록 이끄는 질문.","s":"학생들의 사고를 넓히기 위해 확산적 질문을 하는 것이 중요하다."},{"t":"관련어","w":"재확산","d":"한번 널리 퍼졌던 것이 다시 널리 퍼짐.","s":"코로나19의 재확산 소식에 많은 사람이 외출을 자제하고 있다."},{"t":"유의어","w":"전파","d":"전하여 널리 퍼뜨림.","s":"질병 전파를 막기 위해 사람들은 외출할 때마다 마스크를 착용했다."}]},{"n":30,"w":"초점","st":"초점","d":"사람들의 관심이나 주의가 집중되는 사물의 중심 부분.","ex":"다음 학급 회의에서 급식 개선을 위해 의견을 나눌 때, 특히 후식의 개선에 초점을 맞추기로 했다.","cx":"학교나 학급의 누리집은 공적인 정보를 공유하는 데 초점을 두는 공간이다. 누리집과 달리 사회 관계망 서비스(SNS)는 생각, 의견, 관점 등을 비교적 자유롭게 공유할 수 있는 개방적인 공간으로 쓰이고 있다.","r":[{"t":"문학","w":"초점","d":"작품 속 특정 인물의 관점에서 서술하는 것.","s":"작가는 의도적으로 이야기 서술의 초점을 여자아이로 설정했다."},{"t":"유의어","w":"요점","d":"가장 중요하고 중심이 되는 사실이나 관점.","s":"글쓰기에서 중요한 것은 요점을 정확히 표현하는 것이다."},{"t":"유의어","w":"중점","d":"가장 중요하게 여겨야 할 점.","s":"새로 부임한 축구팀 감독은 수비보다 공격에 중점을 두었다."}]},{"n":31,"w":"취지","st":"취지","d":"어떤 일의 바탕이 되는 목적이나 중요한 뜻.","ex":"이번 봉사 활동의 취지는 단순한 청소 활동을 넘어 환경 보호의 중요성을 깨닫게 하는 데 있다.","cx":"학교는 학생들의 창의성을 키운다는 취지로 다양한 실험 활동을 도입했다. 이 덕분에 학생들은 새로운 아이디어를 시도하며 많은 도전을 할 수 있었다.","r":[{"t":"사회","w":"입법 취지","d":"특정한 법을 만든 목적, 이유, 필요성.","s":"청소년 보호법의 입법 취지는 청소년을 해로운 환경으로부터 지키는 것이다."},{"t":"유의어","w":"의도","d":"무엇을 하고자 하는 생각이나 계획. 또는 무엇을 하려고 힘씀.","s":"친구가 교실을 정리하는 과정에서 내 물건이 없어져서 속상했 지만, 나쁜 의도로 그런 것은 아니니 이해하기로 했다."}]},{"n":32,"w":"통찰","st":"통찰","d":"사물을 깊이 살펴 그 속에 담긴 의미나 본질을 꿰뚫어 봄.","ex":"작은 행동 하나에도 숨은 뜻을 알아내는 그녀의 통찰이 놀라웠다.","cx":"선생님은 학생들의 대답에서 생각을 읽어 내는 통찰을 보여주셨다. 그래서 학생들이 무엇을 어려워하는지 바로 알고 도움을 주셨다.","r":[{"t":"관련어","w":"통찰력","d":"사물을 깊이 살펴 그 속에 담긴 의미나 본래의 성질을 꿰뚫어 보는 능력.","s":"단서를 통해 범인을 추려 내는 그 형사의 통찰력은 매우 뛰어나다."},{"t":"유의어","w":"파악","d":"어떤 대상의 내용이나 본래부터 가진 성질을 확실하게 이해하여 앎.","s":"상황에 대한 정확한 파악이 문제 해결의 첫걸음이다."},{"t":"반의어","w":"오해","d":"이치에 맞지 않게 해석하거나 뜻을 잘못 앎. 또는 그런 해석이나 이해.","s":"글 의 제목만 읽기보다 내용을 끝까지 읽어야 오해를 막을 수 있다."}]},{"n":33,"w":"특질","st":"특질","d":"다른 어떤 것과 구별되는 특별한 성질.","ex":"이 소설의 특질은 주인공의 성장 과정을 사실적으로 보여준다는 점이다.","cx":"다른 화가들과 달리 그는 색을 겹겹이 칠해 깊이를 표현하는 특질을 가지고 있다. 덕분에 많은 사람이 그의 그림을 더욱 특별하게 생각한다.","r":[{"t":"사회","w":"성격 특질","d":"사람의 성격을 이루는 변하지 않고 계속되는 특징.","s":"개개인의 성격 특질은 환경과 문화의 영향을 많이 받는다."},{"t":"유의어","w":"개성","d":"다른 사람과 구별되는 고유의 특성.","s":"다문화 사회에서 서로 다른 개성을 존중하는 것은 기본이다."},{"t":"반의어","w":"보통","d":"특별하지 않고 흔히 볼 수 있음. 뛰어나지도 열등하지도 않은 중간 정도.","s":"그의 성격은 특별히 튀지 않고 보통이라서 누구와도 잘 지낸다."}]},{"n":34,"w":"표절","st":"표절","d":"시, 글, 노래 같은 것을 만들 때 다른 사람의 작품을 몰래 베껴 쓰는 것.","ex":"연구자들은 표절을 방지하기 위해 출처를 명확히 표시하고 인용 규칙을 철저히 지켜야 한다.","cx":"연극 대본을 쓰던 지수는 인터넷에서 본 글을 그대로 옮겨 적었다. 감독님께서 그것은 표절이 될 수 있으니 직접 쓰라고 주의를 주었다.","r":[{"t":"관련어","w":"표절 시비","d":"표절과 관련하여 옳고 그름을 따지는 일.","s":"그 가수는 표절 시비에 휘말려 팬들에게 실망을 안겼다."},{"t":"반의어","w":"독창","d":"다른 것을 따라하지 않고 새로운 것을 처음으로 만들어 내거나 생각해 냄.","s":"오늘날의 거문고는 신라 시대에 만들어진 독창의 악기이다."}]},{"n":35,"w":"한계","st":"한계","d":"어떤 일이나 능력이 실제로 작용할 수 있는 범위.","ex":"또는 그런 범위를 나타내는 선. 사람의 기억력에는 한계가 있어 한 번에 많은 내용을 외우기는 어렵다.","cx":"재생 에너지는 주로 발전소에서 전기를 생산하기 위한 에너지로 활용된다. 태양 전자판을 이용한 발전은 낮에만 전기가 생산되는 한계가 서 볼 필요가 있다.","cx":"어떤 사람은 같은 공원을 보면서도 조용하고 편안하다고 느낀다. 다른 사람은 그곳을 지루하다고 느낀다. 이처럼 장소에 대한 느낌은 개인의 경험이 반영된 주관적 감정이다.","r":[{"t":"국어","w":"주관적 표현","d":"자기의 생각이나 느낌을 중심으로 하여 나타내는 표현.","s":"주장하는 글을 쓸 때 주관적 표현만 쓰면 개인의 생각이나 감정에만 치우친 느낌을 준다."},{"t":"교육","w":"주관식 시험","d":"문제에 대한 자기의 지식이나 생각을 서술하게 하는 시험의 한 형식.","s":"논 술과 같은 주관식 시험은 자신의 생각을 논리적으로 써야 하므로 충분한 연습이 필요하다."},{"t":"반의어","w":"객관적","d":"자기와의 관계에서 벗어나 제삼자의 입장에서 사물을 보거나 생각하는 것.","s":"기 자는 최대한 공정하고 객관적인 시각에서 기사를 써서 사실을 정확하게 보도해야 한다."}]},{"n":49,"w":"전이","st":"전이","d":"어떤 성질, 상태, 작용이 한 곳에서 다른 곳으로 옮겨 가거나 변하여 영향을 미치는 일.","ex":"환자는 상담자와의 대화에서 감정의 전이를 경험했다.","cx":"의사는 환자에게 암세포의 전이가 이미 시작되었음을 알렸다. 이어서 그는, 이를 막기 위해 수술이 필요하다고 설명했다.","r":[{"t":"유의어","w":"이동","d":"움직여서 옮김. 또는 움직여 자리를 바꿈. 양자 전이: 입자가 원래 가지고 있던 에너지에서 더 크거나 작은 에너지로 옮겨 가는 일.","s":"검사 결과, 폐에 있던 암이 간으로 이동되었다."},{"t":"심리","w":"학습 전이","d":"앞서 배운 지식이나 경험이 뒤의 학습에 영향을 주는 일.","s":"수학 시간에 배운 지식이 사회 풀이에 학습 전이되었다."}]},{"n":50,"w":"정비례","st":"정비례","d":"한 쪽 양이 커지면 다른 쪽 양은 그와 같은 비율로 커지고, 한 쪽 양이 작아지면 다른 쪽 양은 그와 같은 비율로 작아지는 것.","ex":"누나와 동생의 나이는 정비례 관계가 아니다.","cx":"사탕 한 개의 가격이 500원일 때, 구매하는 사탕의 개수와 총 가격 사이의 관계 는 정비례 관계이다. 사탕 개수가 2개, 3개...로 늘어날수록 총 가격도 1000원, 1500원...으로 늘어납니다.","r":[{"t":"수학","w":"정비례 그래프","d":"y=ax로 나타내는 그래프임.","s":"정비례 그래프는 원점을 지나는 직선 그래프이다."},{"t":"반의어","w":"정비례하다","d":"두 양이 서로 같은 비율로 늘거나 줄다. 반비례 관계: 한 쪽 양이 커지면 다른 쪽 양은 그와 같은 비율로 작아지고, 한쪽 양이 작아지면 다른 쪽 양은 그와 같은 비율로 커지는 관계.","s":"두 변수 x와 y사이에 x의 값이 2배, 3배로 변할 때 y의 값이 1 1 배, 배가 되는 관계가 있으면 y는 x에 반비례 관계라고 한다. 2 3 정비례"}]},{"n":51,"w":"점유","st":"점유","d":"물건이나 영역, 지위 따위를 차지함.","ex":"그의 토지 점유는 불법이다.","cx":"한 기업의 스마트폰 시장에 대한 점유가 절반을 넘어설 때, 우리는 그 기업이 시장에서 매우 큰 영향력을 가진다고 말한다.","r":[{"t":"유의어","w":"차지하다","d":"사물이나 공간, 지위 따위를 자기 몫으로 가지다. 점유 공간: 누군가가 실제로 차지하여 사용하고 있는 자리나 장소.","s":"아버지의 유산은 모두 그가 차지하게 되었다."},{"t":"경제","w":"점유율","d":"물건이나 영역, 지위 따위를 차지하고 있는 비율.","s":"무허가 건물이 세워진 지역은 주민들의 생활 터전이 되었지만, 법적으로는 불법 점유 공간에 해당한다."}]},{"n":52,"w":"점진적","st":"점진적","d":"조금씩 앞으로 나아감.","ex":"민주주의 제도는 한 번에 완성된 것이 아니라 점진적으로 발전하였다.","cx":"우리의 학습 능력은 한  더 좋게 고침.","ex":"우리 지역에서 생산하는 고랭지 배추는 여러 번의 품종 개량을 거쳐 당도와 식감이 우수합니다.","cx":"영호가 농사를 짓기 시작했을 때 가장 불편했던 것은 농기구였다. 그는 자신이 가진 농기구의 장점은 살리고, 불편한 점은 고쳐 사용하기에 편리하도록 농기구 개량에 힘썼다.","r":[{"t":"생물","w":"개량종","d":"교배나 접목 따위를 하여 독특하거나 우수한 형질을 갖도록 길러 낸 동식물의 새 품종.","s":"토종닭은 달걀은 적게 낳는다는 이유로 외국에서 들여온 개량종에 밀려났다."},{"t":"유의어","w":"개악","d":"고쳐서 도리어 나빠지게 함.","s":"대학 입시 제도를 개선해야 한다."}]},{"n":65,"w":"개론","st":"개론","d":"내용을 대강 추려서 서술함.","ex":"또는 그런 것. 우리는 시에 대한 개론을 공부한 후 구체적인 이론서를 읽기로 했다. 희소성의 원리 가격 탄력성 시장 균형 외부효과 비교 우위 공공재 경제학 개론 거시 경제학 GDP 효용 극대화 무인승차 국제 무역 행동 경제학","cx":"국가직 7급 기술분야 공무원이 되기 위해서는 물리학의 여러 이론들을 대강 추려 놓은 물리학 개론을 공부해야 한다. 직무를 이해하기 위해 기본적인 물리학 지식이 필요하기 때문에 이를 시험 과목으로 지정해 둔 것이다.","r":[{"t":"관련어","w":"개론서","d":"어떤 학문 분야의 전체적인 내용, 특징, 범위 따위를 대강 추려서 서술한 책.","s":"대학 1학년 때는 주로 개론서로 수업을 한다."},{"t":"사회","w":"법학 개론","d":"법학 전반에 대하여 보편적인 기본 개념을 설명하는 일. 또는 그런 책.","s":"법조계에서는 대학생들이 교양 필수 과목으로 법학 개론을 수강해 야 한다고 주장하고 있다."},{"t":"유의어","w":"개설","d":"내용을 줄거리만 잡아 대강 설명함. 또는 그런 글이나 책.","s":"‘고전 문학 개설’이라는 책을 읽고 우리 고전 문학의 흐름 을 알게 되었어. 개론"}]},{"n":66,"w":"개진","st":"개진","d":"주장이나 사실을 밝히기 위하여 의견이나 내용을 펼침.","ex":"공청회에서 시민들은 정책에 대해 자유롭게 의견 개진을 했다.","cx":"토론에 참가한 학생들은 자신들의 주장을 밝히기 위해 의견을 말하는 데 주저함이 없었다. 그들은 서로의 주장을 존중하면서도 끝까지 의견 개진을 하며 토론을 이어 갔다.","r":[{"t":"동형이의어","w":"개진","d":"낡은 기술이나 제도를 고쳐 진보를 꾀함.","s":"인습의 개진이야말로 오히려 전통을 세우는 바람직한 태도이다."},{"t":"유의어","w":"피력","d":"생각하는 것을 털어놓고 말함.","s":"이 소설은 이야기 전개가 너무 산만해."}]},{"n":67,"w":"구도","st":"구도","d":"그림에서 모양, 색깔, 위치 따위의 짜임새.","ex":"정물화에 주로 쓰이는 삼각형 구도는 무게를 아래쪽에 두기 때문에 안정감을 준다.","cx":"화가는 새로운 그림을 그릴 때 시선을 한곳으로 모으는 구도를 사용하기로 했다. 그래서 강줄기를 세로로 길게 배치하여 시선을 그림 깊은 곳으로 자연스럽게 이끌어 그림에 깊이감이 느껴지도록 만들었다.","r":[{"t":"유의어","w":"구성","d":"색채와 형태 따위의 요소를 조화롭게 조합하는 일. 대립 구도: 의견이나 처지, 속성 따위가 서로 반대되는 인물이 형성하는 구도.","s":"다양한 색채를 사용한 풍경화였지만 전체적인 구성이 엉성했다."},{"t":"미술","w":"피라미드 구도","d":"화면의 인물군 구성에 있어, 중앙 인물의 두부를 정점으로 해서 거의 이등변삼각형이 되는 것과 같은 구도.","s":"라파엘로의 ‘검은 방울새의 성모’는 피라미드 구도를 보이는 대표적인 작품이다."}]},{"n":68,"w":"구축","st":"구축","d":"어떤 시설물을 쌓아 올려 만듦.","ex":"또는 체제, 체계 따위의 기초를 닦아 세움. 정부는 설과 역사 기록은 인간 경험을 서사로 풀어낸다는 점에서 상통한다.","cx":"서로 다른 학문도 깊이 들어가다 보면 상통하는 지점이 드러난다. 인간 본성에 대한 철학의 논의가 심리학과 이어지고, 다시 교육학이나 사회학과도 맞닿는다. 전혀 다른 길을 걷던 지식이 이렇게 한 지점에서 만날 수 있음을 우리는 확인하게 된다.","r":[{"t":"반의어","w":"상충하다","d":"맞지 아니하고 서로 어긋나다.","s":"그들의 제안은 우리의 입장에 상충한다."},{"t":"유의어","w":"통하다","d":"내적으로 관계가 있어 연계되다.","s":"문학은 인간 구원의 관점에서 종교와 통하는 면이 있다."},{"t":"관련어","w":"일맥상통","d":"사고방식, 상태, 성질 따위가 서로 통하거나 비슷해짐.","s":"결국은 자네와 내가 일맥상통의 결론에 도달한 것이네."}]},{"n":91,"w":"선결","st":"선결","d":"다른 문제보다 먼저 해결하거나 결정함.","ex":"그 제안이 성공적으로 시행되기 위해서는 몇 가지 선결 조건이 있다.","cx":"도심 재개발 추진에서 선결 과제는 교통 문제 개선이다. 주차 공간 부족과 버스 노선 혼잡을 해소해야, 이후의 진행이 원활할 수 있기 때문이다. 전문가도 “도심 재개발에 앞서 우선 교통 대책부터 마련해야 한다.”라고 강조했다.","r":[{"t":"유의어","w":"선행","d":"딴 일에 앞서 행함.","s":"이 시점에서는 무엇보다도 기술 개발이 선행 과제라고 봅니다."},{"t":"유의어","w":"급선무","d":"무엇보다도 먼저 서둘러 해야 할 일.","s":"통일은 우리 민족이 당면한 급선무이다."},{"t":"반의어","w":"유보","d":"어떤 일을 당장 처리하지 아니하고 나중으로 미루어 둠.","s":"분위기가 안정될 때까지 노동법 개정의 유보가 필요하다."}]},{"n":92,"w":"선별","st":"선별","d":"가려서 따로 나눔.","ex":"남아 있는 고려 속요는 조선 시대 사대부들의 선별을 거쳐 살아남은 것들이다.","cx":"현대 사회에서는 쏟아지는 정보 속에서 필요한 것과 불필요한 것을 가려내는 선별의 능력이 점점 더 중요해지고 있다. 믿을 만한 사실을 남기고 거짓이나 과장된 내용을 걸러낼 때, 우리는 더 현명한 판단을 할 수 있다.","r":[{"t":"유의어","w":"구별","d":"성질이나 종류에 따라 차이가 남. 또는 성질이나 종류에 따라 갈라놓음.","s":"요즘 옷은 남녀의 구별이 없는 경우가 많다."},{"t":"유의어","w":"구분","d":"일정한 기준에 따라 전체를 몇 개로 갈라 나눔.","s":"옳고 그른 일의 구분이 필요하다."},{"t":"유의어","w":"선정","d":"여럿 가운데서 어떤 것을 뽑아 정함.","s":"작품 선정의 기준을 밝힐 필요가 있다."}]},{"n":93,"w":"연역","st":"연역","d":"일반적인 사실이나 원리를 전제로 하여 개별적인 특수한 사실이나 원리를 이끌어 내는 일.","ex":"경험을 필요로 하지 않는 순수한 사유에 의하여 이루어지며 그 전형은 삼단 논법이다. 일반적 원리 논문 심사위원들은 그의 논리 전개와 연역의 완결성에 주목했다.","cx":"고대 철학자들은 연역을 중시했다. 아리스토텔레스는 “모든 인간은 죽는다.”라는 보편적인 명제와 “소크라테스는 인간이다.”라는 사실을 결합해 “소크라테스는 죽는다.”라는 개별적인 원리를 이끌어 내는 삼단 논법을 제시했다. 이는 참된 전제로부터 필연적인 결론을 도출하는 방식이다.","r":[{"t":"상위어","w":"추론","d":"어떠한 판단을 근거로 삼아 다른 판단을 이끌어 냄.","s":"어떤 가설이 추론을 통해 다른 현상을 예측하고 설명할 수 있으면 하나의 법칙으로 인정될 수 있다."},{"t":"유의어","w":"유추","d":"두 개의 사물이 여러 면에서 비슷하다는 것을 근거로 다른 속성도 유사할 것이라고 추론하는 일.","s":"이러한 추측은 침팬지의 행태 관찰과 유추에 의해 나온 것이다."}]},{"n":94,"w":"임의","st":"임의","d":"정해진 기준이나 원칙 없이 마음 가는 대로 함.","ex":"그렇게 중요한 일을 임의로 처리할 수는 없다.","cx":"회사에서 네 임의대로 할 수 있는 문제가 많지 않다. 기준이나 원칙에 따르지 않고 내키는 대로 일을 해서는 안 된다.","r":[{"t":"유의어","w":"무작위","d":"일부러 꾸미거나 뜻을 더하지 아니함.","s":"친구가 벽에 그린 낙서는 무작위로 그은 선들의 집합이었다."},{"t":"유의어","w":"임의 규정","d":"당사자의 의사에 따라 적용하지 아니할 수도 있는 규정.","s":"법을 자의로 해석하면 큰 혼란이 생길 수 있다."}]},{"n":95,"w":"유전적","st":"유전적","d":"어버이의 특성이 다음 세대에 전하여 나타나는 것.","ex":"젊었을 때 나타나는 위암은 유전적인 요인이 작용한 건 아닌지 확인할 필요가 있다.","cx":"신체 조건이 선천적으로 부족한 선수들은 유전적인 요인을 보완하기 위해 부단히 노력한다. 부모로부터 전달받은 특성 이외에 다양한 환경적인 요소를 활용하여 우수한 성적을 거둔다.","r":[{"t":"유의어","w":"선천적","d":"태어날 때부터 지니고 있는 것.","s":"그는 선천적으로 약한 체질이어서 조금만 무리하면 심한 몸살을 앓는다."},{"t":"반의어","w":"환경적","d":"생물에게 영향을 주는 자연적인 조건이나 사회적 상황과 관련된 것.","s":"사람의 성격 형성에는 환경적인 요소가 많은 작용을 한다."},{"t":"생물","w":"유전적 변이","d":"유전자의 변화로 인해 모양과 성질이 다른 개체가 나타나는 현상.","s":"진화 과정에서 생긴 작은 유전적 변이들이 모여 새로운 종이 형성되었다."}]},{"n":96,"w":"응집","st":"응집","d":"한군데에 엉겨서 뭉침.","ex":"예선 탈락의 위기를 이겨 내기 위해서는 선수들의 응집이 절실히 필요하다.","cx":"나라가 어려움에 처해 있을 때는 많은 사람들의 힘을 모으는 것이 필요하다. 의견이 서로 나눠지지 않고 힘의 응집을 이끌면 어려운 일도 쉽게 해결이 가능하다.","r":[{"t":"유의어","w":"결집","d":"한곳에 모여 뭉침.","s":"그는 뜻을 같이할 사람들의 결집을 촉구하며 연설의 마지막을 장식했다."},{"t":"반의어","w":"분열","d":"찢어져 나뉨.","s":"의견 차이가 커지면서 조직 내부에 분열이 일어났다."},{"t":"물리","w":"응집력","d":"물체가 외부 힘의 작용에 저항하여 원형을 지키려는 힘.","s":"물분자는 강한 응집력 때문에 구형의 물방울을 형성한다."}]},{"n":97,"w":"응축","st":"응축","d":"여러 가지를 하나로 집중시키는 일.","ex":"속담에는 조상들이 체득한 지혜의 응축이 담겨 있다.","cx":"그가 살아온 삶의 응축이 작품으로 첫선을 보였다. 희로애락이 한데 뭉쳐진 삶을 깊은 성찰로 다루며, 관객들의 마음이 흩어지지 않게 집중시키는 힘을 보여 준다.","r":[{"t":"유의어","w":"응결","d":"한데 엉기어 뭉침.","s":"아이는 자신의 팔에 흐르던 피의 응결을 바라보고 있었다."},{"t":"반의어","w":"분산","d":"갈라져 흩어짐.","s":"정부는 수도권 과밀을 완화하기 위해 인구 분산 정책을 추진하고 있다."},{"t":"화학","w":"응축","d":"기체가 액체로 변하는 현상.","s":"공기 중의 수증기가 차가운 유리잔 표면에서 물방울로 응축되었다."}]},{"n":98,"w":"이차적","st":"이차적","d":"어떤 사물이나 현상이 본래적·중심적인 것에 대하여 부수적인 관계에 있는 것.","ex":"생사의 갈림길에 처해 있을 때, 삶의 질을 논하는 것은 이차적인 문제이다.","cx":"핵심을 파악하면 사물 이해에 많은 도움이 되지만 모두가 그런 것은 아니다. 주된 것에 딸려 있는 이차적인 측면을 살펴보면서도 사물을 더 깊게 이해하는 경우가 종종 나타나기 때문이다.","r":[{"t":"유의어","w":"부차적","d":"주된 것이 아니라 그것에 곁딸린 것.","s":"이번 문제의 핵심은 경제 구조 개혁이고, 세금 인상은 부차적인 문제이다."},{"t":"반의어","w":"중심적","d":"사물이나 행동에서 매우 기본이 되는 것.","s":"이 부분을 중심적으로 전개해서 글을 쓰면 좋은 소설이 될 것 같아요."},{"t":"사회","w":"이차적 자료","d":"직접 얻은 것이 아니라 다른 사람에 의하여 이미 만들어진 자료.","s":"그 는 통계청에서 발간한 보고서를 이차적 자료로 활용하여 논문을 작성했다."}]},{"n":99,"w":"이행","st":"이행","d":"어떤 일을 실제로 행함.","ex":"그는 대한민국 국민이어서 국방의 의무를 충실히 이행 중이다.","cx":"무역 협정의 충실한 이행을 위해서는 실행 주체들의 의지가 중요하다. 실제로 시행하는 사람들이 어떠한 생각을 갖고 실천 방안을 마련하는지 살펴봐야 한다.","r":[{"t":"유의어","w":"실시","d":"실제로 시행함.","s":"고객 만족도를 알아보기 위한 설문 조사가 실시를 앞두고 있다."},{"t":"유의어","w":"이행 감사","d":"규칙을 잘 지키는지 알아보기 위해 재무나 영업 활동을 분석하여 따지는 일.","s":"팀원들은 신제품을 홍보하기 위해 구체적인 실행 방안을 마련했다. 실시했다."}]},{"n":100,"w":"인위적","st":"인위적","d":"자연의 힘이 아닌 사람의 힘으로 이루어지는 것.","ex":"인위적으로 식욕을 억제하는 다이어트 제품은 부작용을 초래할 수 있다.","cx":"건강을 인위적으로 조절하는 것은 쉽지 않다. 사람이 가공한 것보다 자연 상태 그대로의 것을 주로 섭취하며, 짜고 맵게 조리된 것은 피하는 것이 바람직하다.","r":[{"t":"유의어","w":"인공적","d":"사람의 힘으로 만든 것.","s":"그의 미소는 너무 인공적이라 진심이 느껴지지 않았다."},{"t":"반의어","w":"자연적","d":"사람의 손길이 가지 않은 자연 상태 그대로의 것.","s":"우리 마을은 강가 주변의 도로를 따라 자연적으로 형성되었다."},{"t":"심리","w":"인위적 장애","d":"목적 없이 특정 장애나 질병을 의도적으로 흉내 내는 정신 장애.","s":"의 료진은 치료 반응이 없고 검사 결과가 모순될 때 인위적 장애 가능성을 고려한다."}]},{"n":101,"w":"인자","st":"인자","d":"어떤 사물의 원인이 되는 하나하나의 요소나 물질.","ex":"기후 변화는 농업 생산에 부정적인 영향을 미치는 중요한 인자이다.","cx":"물이 생명체 유지에 중요한 성분인 것처럼 협력과 소통은 팀의 성공을 이끄는 핵심 인자이다. 파편화된 사회에서 소통을 통한 관계의 중요성은 더 강조되고 있다.","r":[{"t":"유의어","w":"성분","d":"물질의 바탕을 이루는 하나하나의 요소.","s":"염분은 사람의 몸에서 없어서는 안 될 중요한 성분이다."},{"t":"유의어","w":"요소","d":"사물의 성립이나 효력 발생 따위에 꼭 필요한 성분.","s":"민주주의 사회를 구성하는 중요한 요소는 자유와 평등이다."},{"t":"생물","w":"결정 인자","d":"어떤 소질의 생성에 기여하거나 어떤 특징을 결정하는 인자.","s":"식물의 꽃 색깔은 안토시아닌 합성과 관련된 결정 인자에 의해 좌우된다."}]},{"n":102,"w":"주류","st":"주류","d":"사상이나 학술 따위의 주된 경향이나 갈래.","ex":"지금 힙합이 한국 대중음악의 주류 장르로 인정받고 있다.","cx":"우리 반에서 환경 문제를 주제로 토론할 때는 다양한 의견이 나왔다. 어떤 학생은 쓰레기 줄이기를, 또 어떤 학생은 에너지 절약을 강조했지만, 결국 다수의 생각은 분리수거 강화에 모였다. 이렇게 분리수거 강화가 토론의 주류가 되어 토론의 흐름을 이끌었다. 수준: 중등, 3등급","r":[{"t":"동형이의어","w":"주류","d":"술의 종류. 주류 시장: 여러 시장 중에서 규모가 가장 크고 중심이 되는 시장.","s":"북한은 다양한 화장품 브랜드를 개발하여 생산하고 있으며, 대동강 맥주, 평양 소주 등과 같은 주류 제품을 해외로 수출하기도 한다."},{"t":"사회","w":"비주류","d":"사상이나 학술 따위의 중심에서 벗어난 갈래.","s":"한국의 케이팝(K-pop)은 대중음악의 주류 시장이라고 불리는 미 국, 영국 등에서 성공을 거두었다."}]},{"n":103,"w":"주체","st":"주체","d":"어떤 단체나 물건의 주가 되는 부분.","ex":"우리 반의 봉사 활동은 학생들이 주체가 되어 계획하고 실천한다.","cx":"한 나라에서는 국민이 가장 중요한 존재로 여겨진다. 법과 제도도 국민을 위해 만들어진다. 그래서 국민은 나라의 주체라고 할 수 있다.","r":[{"t":"사회","w":"경제 주체","d":"개인, 기업, 정부 등과 같이 자기의 의사와 판단에 따라 경제 활동을 하는 자.","s":"물 가가 급격히 오르면 국민 생활이 불안정해지므로 경제 주체들은 물가 안정을 위해 노력한다."},{"t":"사회","w":"정치 주체","d":"자신의 이익이나 가치에 따라 의견을 내고 공동체 결정에 영향을 주는 개인이나 집단.","s":"정 치 주체에는 국회, 정부, 법원과 같은 국가 기관과 정당, 이익 집단, 시민 단체, 언론, 개인 등이 있다."},{"t":"관련어","w":"주체적","d":"어떤 일을 실천하는 데 자유롭고 자주적인 성질이 있는.","s":"미 디어를 주체적으로 활용하려면 정보와 그 맥락을 비판적으로 분석할 능력이 필요하다."}]},{"n":104,"w":"준거","st":"준거","d":"사물의 정도나 성격 따위를 알기 위한 근거나 기준=표준.","ex":"토론 수업에서 친구의 의견 을 평가할 때는 교사가 제시 한 준거를 따라야 한다.","cx":"글쓰기 대회를 할 때 심사위원들은 글을 마음대로 평가하지 않는다. 미리 정해 둔 항목에 따라 글의 내용과 표현을 살핀다. 이렇게 정해진 평가의 준거가 있어야 공정하게 심사할 수 있다.","r":[{"t":"사회","w":"준거 집단","d":"개인이 자기 행위나 규범의 표준으로 삼는 집단.","s":"사람들은 준거 집단 내에서 역할 모델을 찾고, 그를 따라 하며 자신을 발전시킨다."},{"t":"사회","w":"준거 기준","d":"개인이 자기 행위의 옳고 그름이나 규범 따위를 판단하는 데 표준으로 삼는 기준.","s":"한 시민은 길에서 쓰레기를 버릴지 말지 고민하다가 ‘환경 보호 의무’ 라는 사회 규범을 준거 기준으로 삼아 쓰레기를 버리지 않았다."},{"t":"심리","w":"내적 준거","d":"가치 평가에 기준이 되는 인간 내면의 판단 근거.","s":"나는 성적보다 노력하는 태도를 내적 준거로 삼아 스스로를 평가한다."}]},{"n":105,"w":"중재하다","st":"중재","d":"분쟁에 끼어들어 쌍방을 화해시키다.","ex":"한반도의 평화 속에서 우리나라는 동아시아 교류의 중심지로서 주변 국가들의 갈등을 중재하며 평화와 협력을 이끌 수 있다.","cx":"두 친구가 자리 때문에 심하게 다투었다. 그런데 학급 회장이 두 사람의 말을 차례로 들어 보고는 서로 번갈아가며 앉는 방법을 제안하며 두 사람의 싸움을 중재했다.","r":[{"t":"사회","w":"국제 중재","d":"국제 분쟁이 발생하였을 때, 제삼자인 국제기관이 분쟁 당사국 사이에 개입 하여 분쟁의 해결을 꾀하는 일.","s":"스포츠 대회에서 나라 사이의 규칙 해석이 달라 문제가 되자, 올림픽 위원회가 국제 중재를 맡았다."},{"t":"사회","w":"언론 중재 위원회","d":"신문·방송 때문에 피해가 생겼을 때, 잘못된 내용을 고치게 하거나 다른 입장을 말할 기회를 주고 해결해 주는 기관.","s":"한 연예인이 사실과 다른 기사로 큰 피해를 입자, 언론 중재 위원회가 나서서 기자와 신문사에 잘못된 내용을 고치도록 했다."},{"t":"관련어","w":"중재자","d":"분쟁에 끼어들어 쌍방을 화해시키는 사람.","s":"지역 주민들이 쓰레기 처리 문제로 의견이 갈리자, 마을 회장이 중재자로 나서서 해결책을 제시했다."}]},{"n":106,"w":"중점","st":"중점","d":"GOAL IDEA 가장 중요하게 여겨야 할 점.","ex":"FOCUS 이번 토론의 중점은 서로의 의견을 존중하는 것이다. PLAN TARGET","cx":"내일 사회 시간에는 환경 문제에 대해 발표를 한다. 선생님께서는 여러 가지 내용을 말하기보다 발표의 핵심을 분명히 하라고 하셨다. 그래서 나는 플라스틱 쓰레기 문제를 발표의 중점으로 삼았다.","r":[{"t":"사회","w":"중점 산업","d":"계획 경제나 전쟁 시기에 필요에 따라 특히 중점을 두는 산업.","s":"지역 경제를 살리기 위해, 지자체는 관광을 중점 산업으로 선정하고 문화유산과 축제를 활용한 다양한 사업을 추진하고 있다."},{"t":"경영","w":"중점 분석","d":"기본 분석의 결과에 기초하여 특정 항목을 선정하고 심층적으로 상세히 분석하는 일.","s":"기업은 한정된 자원을 효율적으로 사용하기 위해 매출에 가장 큰 영향을 미치는 핵심 제품을 중점 분석하여 경영 전략을 세운다."},{"t":"관련어","w":"중점적","d":"여럿 가운데 가장 중요하게 여기는 것.","s":"부유한 나라와 가난한 나라 사이의 백신 불평등 문제로, 주요 기업들이 공평하고 효과적인 백신 개발과 공급을 중점적으로 논의하기로 했다."}]},{"n":107,"w":"증대하다","st":"증대","d":"양이 많아지거나 규모가 커지다.","ex":"또는 양을 늘리거나 규모를 크게 하다. 온라인 수업이 늘면서 학생들이 동영상 강의를 시청하고 과제를 제출하는 과정 에서 인터넷 사용량이 크게 증대했다. 규모 시간","cx":"올해 도서관에서 새 책을 많이 들여왔다. 책의 수가 해마다 증대하여 도서관에 책이 가득 차게 되었다. 학생들은 더 다양한 책을 쉽게 빌릴 수 있게 되었다.","r":[{"t":"경제","w":"양적 증대","d":"세거나 잴 수 있는 분량이나 수량이 많아지거나 그 규모가 커짐.","s":"올해 자동차 산업은 생산량의 양적 증대와 더불어 품질 향상에도 힘썼다."},{"t":"사회","w":"고용 증대","d":"고용 시장에서 고용되는 사람이 많아지는 일.","s":"정 부가 새로운 산업단지를 조성하면 많은 일자리가 생겨 지역 사회의 고용 증대에 도움이 된다."},{"t":"관련어","w":"증대시키다","d":"더하여 많아지게 하다.","s":"새 로 개통된 놀이공원에 방문객이 크게 늘자, 운영진 측에서 편의 시설을 증대시켜 더 많은 사람들이 이용할 수 있도록 했다."}]},{"n":108,"w":"증진하다","st":"증진","d":"기운이나 세력 따위를 점점 더 늘려 가고 나아가게 하다.","ex":"꾸준히 책을 읽고 정리하는 습관은 학생들의 기억력을 증진하는 중요한 역할을 한다","cx":"아침마다 학교에서는 전교생이 함께 운동장을 돌며 체조를 한다. 이 활동은 학생들의 체력을 키우고 건강을 증진하는 데 도움을 준다. 몸을 규칙적으로 움직이면 더 튼튼해지고 건강해진다.","r":[{"t":"경영","w":"능률 증진","d":"되도록 시간과 비용과 힘을 덜 들이고 일의 효과를 빨리, 또 많이 유효하게 내게 함.","s":"경 영진은 반복적인 일을 자동화해 전체 조직의 능률 증진과 비용 절감을 동시에 달성했다."},{"t":"사회","w":"편의 증진","d":"사람들이 생활하거나 이용할 때 더 쉽고 편리하게 할 수 있도록 개선하는 것.","s":"새 로운 지하철 노선 개통은 시민들의 생활에 큰 변화를 주며 편의 증진 에 기여하였다."},{"t":"가정","w":"식욕 증진","d":"음식을 먹고 싶어 하는 마음이나 입맛이 점점 늘어나고 강해지는 것.","s":"매 일 아침 가볍게 산책하는 규칙적인 운동은 식욕 증진에 도움이 된다."}]},{"n":109,"w":"지향하다","st":"지향","d":"작정하거나 지정한 방향으로 나아가다.","ex":"과학 수업은 탐구 중심 학습을 지향해 학생들이 실험 계획을 세우고 결과를 공유하도록 한다.","cx":"우리 반은 서로 존중하는 수업을 지향한다. 그래서 친구의 의견을 들을 때는 끝까지 경청하려고 노력한다. 또한 서로의 생각을 존중하며 토론하는 분위기를 만들어 간다.","r":[{"t":"경영","w":"고객 지향","d":"생산과 판매 활동의 모든 일을 고객 위주로 하는 경영 방식.","s":"고 객 지향을 달성하기 위해, 고객들의 의견을 세심하게 듣고 반영하겠습니다."},{"t":"사회","w":"성과 지향","d":"일을 해 나가는 과정보다 성과를 중시하는 방향으로 나아감.","s":"성 과 지향 기업은 결과가 좋고 우수한 실적을 낸 부서에 더 많은 지원을 해준다."},{"t":"교육","w":"목표 지향 평가","d":"학습자가 미리 정해 둔 목표를 얼마나 달성했는지 판단하는 형태의 평가 방법.","s":"학교는 프로젝트 활동에서 목표 지향 평가를 적용하여, 계획 단계에서 제시한 목표가 제대로 실현되었는지를 확인했다."}]},{"n":110,"w":"진취적","st":"진취적","d":"적극적으로 나아가 일을 이룩하는 것.","ex":"학생회는 학교 축제를 준비하며, 전 에 없던 프로그램을 제안하고 직접 실행하는 진취적인 태도를 보였다.","cx":"민수는 레몬으로 전기를 발생시키는 실험을 시도했지만 계속 실패했다. 그러나 그는 포기하지 않고 방법을 바꾸어 다시 도전했다. 그 과정에서 민수는 진취적인 태도를 보여 주었다.","r":[{"t":"심리","w":"진취적 성향","d":"새로운 일이나 어려운 일에도 적극적으로 도전하고, 실패를 두려워하지 않는 성격적 경향.","s":"성 격 검사 결과, 그는 진취적 성향이 높게 나타나 새로운 도전을 즐기고 리더 역할을 잘 수행할 것으로 해석되었다."},{"t":"경영","w":"진취적 사고","d":"기존에 머물지 않고, 새롭고 발전적인 생각을 하며 적극적으로 문제를 해결하려는 사고 방식.","s":"기 업의 최고 경영자는 진취적 사고를 가지고, 위기를 새로운 사업 기회로 바꾸었다."},{"t":"관련어","w":"진취성","d":"적극적으로 나아가서 일을 이룩하는 성질.","s":"그 선수는 진취성이 강해서 어떤 상대를 만나도 과감하게 공격하 여 승리할 것이다."}]},{"n":111,"w":"근접하다","st":"근접","d":"가까이 다가가다.","ex":"우리는 무대에 근접한 자리에 앉아서 공연을 생생하게 볼 수 있었다.","cx":"기차가 역에 근접하자 안내 방송이 흘러나왔다. 창밖으로 역 이름이 보이자 승객들의 얼굴에는 기대와 설렘이 묻어났다. 사람들은 짐을 챙기며 내릴 준비를 하기 시작했다.","r":[{"t":"사회","w":"문화적 근접성","d":"사람들이 다른 문화를 받아들일 때 자기 나라의 문화와 유사한 문화를 더 좋아하는 성향.","s":"사 람들은 문화적 근접성 때문에 낯선 문화보다 익숙한 문화가 담긴 작품을 더 많이 선택했다."},{"t":"사회","w":"직주 근접","d":"직장과 주거지가 가까이에 있음.","s":"직주 근접이 이루어지면 출퇴근 시간이 줄어들어 여가 시간이 많아진다."},{"t":"관련어","w":"근접성","d":"지리적 또는 심리적으로 가까운 성질.","s":"이 도시는 바다와의 근접성 때문에 관광지로 인기가 많다."}]},{"n":112,"w":"논거","st":"논거","d":"주장을 뒷받침하는 근거.","ex":"이 글에는 글쓴이의 주장에 대한 논거가 뚜렷하게 드러나 있다.","cx":"학생 대표는 학교에 자전거 보관소가 필요하다고 주장하였다. 그는 많은 학생들이 자전거로 등교한다는 사실을 논거로 들었다.","r":[{"t":"사회","w":"정책 논거","d":"일정한 정치적 목적을 달성하기 위해, 제안한 제도나 방법의 필요성, 효과성 등을 증명하는 근거.","s":"정부는 환경 보호 정책을 세울 때, 그 필요성과 효과를 보여 줄 정책 논거를 마련해야 한다."},{"t":"유의어","w":"근거","d":"어떤 일이나 판단, 주장 등이 나오게 된 바탕이나 까닭.","s":"그는 조사한 자료를 근거로 삼아 자신의 주장을 분명히 밝혔다."},{"t":"유의어","w":"논증","d":"옳고 그름을 이유를 들어 밝힘. 또는 그 근거나 이유.","s":"그 과학자는 실험 결과에 따른 철저한 논증을 바탕으로 새로운 주장을 내놓았다."}]},{"n":113,"w":"매체","st":"매체","d":"어떤 작용을 한쪽에서 다른 쪽으로 전달하는 물체.","ex":"또는 그런 수단. 인터넷과 같은 매체를 통해 사람들은 다양한 지식을 얻는다.","cx":"교내 방송은 학교의 소식을 전달해 주는 매체이다. 이를 통해 학생들은 행사 일정을 쉽게 알 수 있으며, 방송은 학생들의 행사 참여를 이끌어 내는 데 중요한 역할을 한다.","r":[{"t":"국어","w":"매체 언어","d":"신문, 방송, 인터넷 등 각종 매체에서 사용하는 언어.","s":"인터넷과 방송에서 사용되는 매체 언어는 매체의 성격에 따라 다른 특징을 보인다."},{"t":"관련어","w":"대중 매체","d":"많은 사람에게 대량으로 정보를 전달하는 매체.","s":"신문은 예전부터 중요한 대중 매체로서 사회의 소식을 널리 전해 왔다."},{"t":"유의어","w":"매개체","d":"둘 사이에서 어떤 일을 맺어 주는 것.","s":"인 터넷은 전 세계 사람들을 연결해 주는 중요한 매개체의 역할을 한다."}]},{"n":114,"w":"묘사하다","st":"묘사","d":"어떤 대상이나 사물, 현상 등을 언어나 그림으로 표현하다.","ex":"나는 친구가 꽃을 묘사한 작품을 보고 감탄했다.","cx":"화가는 눈앞에 펼쳐진 풍경을 그림으로 생생하게 묘사했다. 훗날 그 그림을 본 관람객들은 마치 그곳에 있는 듯한 느낌을 받았다.","r":[{"t":"미술","w":"정밀 묘사","d":"아주 정교하고 치밀하여 빈틈이 없고 자세하게 그려 냄.","s":"화가는 정밀 묘사를 통해 인물이 입은 옷의 주름까지 생생하게 나타냈다."},{"t":"국어","w":"심리 묘사","d":"소설 등에서, 작중 인물의 심리 상태나 심리의 변화를 그려 내는 일.","s":"그 작품은 심리 묘사가 매우 뛰어나 독자가 인물의 감정을 따라가기 쉽다."},{"t":"관련어","w":"묘사력","d":"어떤 대상이나 사물, 현상 따위를 언어나 그림으로 표현하는 힘.","s":"그 작가는 뛰어난 묘사력으로 자연 풍경을 생생하게 표현했다."}]},{"n":115,"w":"반론","st":"반론","d":"다른 사람의 주장에 대하여 반대함.","ex":"곧바로 상대방의 주장에 대한 반론이 이어져 토론은 더욱 활발해졌다.","cx":"선생님께서는 다음 체육 시간에 단체 경기와 개인 운동 중 무엇을 할지 의견을 나누어 보라고 하셨다. 한 학생이 개인 운동을 하자고 주장하자, 다른 학생은 단체 운동이 협동심을 키우는 데 도움이 될 것이라며 반론을 펼쳤다.","r":[{"t":"관련어","w":"반론문","d":"다른 사람의 주장에 대해 반대하는 글.","s":"반론문을 쓸 때는 우선 상대방 주장의 핵심을 정확히 이해하는 것 이 중요하다."},{"t":"관련어","w":"찬반론","d":"어떤 일이나 단체에 대하여 찬성하거나 반대한다는 주장.","s":"현재 그 문제를 두고 찬반론이 팽팽히 맞서고 있다."},{"t":"유의어","w":"이견","d":"어떠한 의견에 대한 다른 의견. 또는 서로 다른 의견.","s":"그의 말에 이견을 가지는 사람은 한 명도 없었다."}]},{"n":116,"w":"반발하다","st":"반발","d":"어떤 상태나 행동 등에 대하여 거스르고 반대하다.","ex":"그는 상대방의 의견을 받아들 일 수 없다며 반발했다.","cx":"마을에 큰 도로를 만든다는 소식이 전해졌다. 그 과정에서 공원이 없어진다는 계획이 알려지자, 마을 사람들은 크게 반발했다. 사람들은 아이들이 안전하게 뛰어놀 공간이 사라진다며 걱정하였다.","r":[{"t":"관련어","w":"반발심","d":"어떤 상태나 행  미래 인재를 기르는 데 핵심 과제로 떠올랐다."}]},{"n":148,"w":"현상","st":"현상","d":"인간이 알아서 깨달을 수 있는 사물의 모양이나 상태.","ex":"청소년 사이에서 새로운 유행이 빠르게 퍼지는 것은 현대 사회에 서 흔히 볼 수 있는 현상이다.","cx":"무지개는 비가 온 뒤에 볼 수 있는 자연 현상이고, 봄에 꽃이 피는 것도 계절의 변화로 나타나는 현상이다.","r":[{"t":"사회","w":"고령화 현상","d":"한 사회에서 노인 인구의 비율이 높은 상태로 나타나는 현상.","s":"농촌 지역의 고령화 현상이 심각한 사회 문제로 떠올랐다."},{"t":"관련어","w":"현상 유지","d":"나타나 보이는 현재의 상태를 그대로 보존하거나 변함없이 계속하여 지탱함.","s":"회사는 급격한 변화보다는 현상 유지를 우선시했다."},{"t":"유의어","w":"양상","d":"사물이나 현상의 모양이나 상태.","s":"토론은 예상하지 못한 양상으로 흘러갔다."}]},{"n":149,"w":"현황","st":"현황","d":"현재의 상황.","ex":"문제의 현황을 정확하게 전달 하기 위해서는 적절한 표현 방법을 선택하는 것이 중요하다. 현재","cx":"우리 학교 도서관의 교과목별 도서 현황을 조사해 보니 과학 교과의 책이 가장 많았다. 조사 결과를 통해 어떤 교과의 책을 더 보충해야 하는지 알 수 있었다.","r":[{"t":"관련어","w":"현황도","d":"현재의 상황을 한눈에 볼 수 있도록 제작한 그림이나 지도.","s":"재 난 대응 훈련을 위해 건물 피난로 현황도가 활용되었다."},{"t":"관련어","w":"현황 자료","d":"현재 상황을 보여 주는 연구나 조사 등의 바탕이 되는 자료.","s":"인 구 통계 현황 자료가 정부 홈페이지에 공개되었다."},{"t":"유의어","w":"현주소","d":"현재의 상황, 처치 등을 비유적으로 이르는 말.","s":"이번 조사 결과는 우리 사회 교육의 현주소를 나타낸다."}]},{"n":150,"w":"형상","st":"형상","d":"사물의 생긴 모양이나 상태.","ex":"각종 부품의 형상과 크기 등을 통일하여 제작 비용을 줄이고, 제품 생산 시간을 단축하였다.","cx":"하늘에 떠 있는 구름이 마치 용의 형상처럼 보였다. 사람들은 모두 그 모양을 보고 진짜 용을 떠올렸다.","r":[{"t":"관련어","w":"형상화","d":"형체로는 분명히 나타나 있지 않은 것을 어떤 방법이나 매체를 통하여 구체적이고 명확한 형상으로 나타내는 것.","s":"예술가는 자신의 감정을 이미지로 표현하기 위해 형상화를 시도하였다."},{"t":"유의어","w":"외관","d":"겉으로 드러난 모양.","s":"건물의 외관은 오래되어 보였지만, 내부는 깨끗하게 관리되어 있었다."},{"t":"반의어","w":"내심","d":"겉으로 드러나지 않는 실제의 마음.","s":"그녀는 겉으로는 차분했지만 내심 크게 놀랐다."}]},{"n":151,"w":"형식적","st":"형식적","d":"사물이 겉으로 드러나 보이는 모양을 위주로 하는 것.","ex":"그의 미소는 호의로 보였지만 어디까지 나 형식적 태도였다. 나는 그의 웃음 속 에서 깊은 신뢰를 확인하기 어려웠다.","cx":"글쓰기 대회에서는 먼저 형식적 조건을 충족했는지를 확인하였다. 글자 수, 제출 기한 등을 점검한 뒤 심사가 이어졌다.","r":[{"t":"관련어","w":"비형식적","d":"일정한 형식을 갖추지 않은, 또는 그런 것.","s":"대통령과 시민의 비형식적 만남이 뉴스에 보도되었다."},{"t":"유의어","w":"표면적","d":"겉으로 나타나거나 눈에 띄는. 또는 그런 것.","s":"문제의 표면적 원인만 보고 넘어가서는 안 된다."},{"t":"반의어","w":"내면적","d":"겉으로 드러나지 않는 정신적인 것.","s":"주인공의 내면적 갈등이 소설의 중심이 되었다."}]},{"n":152,"w":"치환하다","st":"치환","d":"어떤 것을 다른 것으로 바꾸어 놓다.","ex":"그 조각가는 고된 삶의 경험을 하나의 예술 작품으로 치환해 내었다.","cx":"나는 ‘사랑’이라는 단어를 ‘믿음’으로 치환할 수 있다. 나는 ‘사랑’을 하면 ‘믿음’을 갖게 되기 때문에 두 단어의 의미가 비슷하게 느껴진다. 그래서 나는 때때로 이 단어들을 서로 바꾸어 쓰기도 한다.","r":[{"t":"유의어","w":"교체하다","d":"사람이나 사물을 다른 사람이나 사물로 대신하다.","s":"그 지역 상수도관은 많이 낡고 부식되었기 때문에 교체해야 한다."},{"t":"유의어","w":"전환하다","d":"다른 방향이나 상태로 바꾸다.","s":"최근 여러 나라에서는 통신 방식을 아날로그에서 디지털 방식으로 대체하기 시작했다."}]},{"n":153,"w":"타율적","st":"타율적","d":"자신의 의지와 관계없이 정해진 원칙이나 규율에 따라 움직이는.","ex":"법은 타율적 성질을 띠는 데 비해 도덕은 자율적 성질을 띤다.","cx":"나는 그곳의 타율적 분위기에서 그들의 말에 따를 것을 강요받았다. 나는 그런 분위기 속에서 무엇 하나도 내 마음대로 할 수 없었고 결국 그들이 시키는 대로 움직였다.","r":[{"t":"관련어","w":"타율","d":"자신의 의지와 관계없이 정해진 원칙이나 규율에 따라 움직이는 일.","s":"자율로 만들어진 규칙은 효과가 없었기 때문에 결국 타율에 의해 학교 규칙이 정해졌다."},{"t":"유의어","w":"주체적","d":"어떤 일을 실천하는 데 남의 간섭없이 자유롭게 스스로 하는 성질이 있는.","s":"피동적 생활 태도에서 벗어나 능동적으로 살아 보자."}]},{"n":154,"w":"통칭","st":"통칭","d":"일반적으로 널리 이름.","ex":"또는 그런 이름이나 말. ‘부인’이라는 단어는 결혼한 사람을 떠올리게 하기 때문에 여성의 통칭으로는 쓰지 않는다.","cx":"10대를 일컫는 통칭으로 ‘학생’보다는 ‘청소년’이 적절하다. 왜냐하면 ‘학생’은 학교에 다니지 않는 10대를 아우르지 못하는 호칭인 데 반해, ‘청소년’은 10대 모두를 아우를 수 있는 일반적인 호칭이기 때문이다.","r":[{"t":"관련어","w":"통칭하다","d":"일반적으로 널리 이르다.","s":"사람들은 보통 가사 활동에 필요한 전기 제품을 가전제품이라고 통칭해 왔다."},{"t":"유의어","w":"총칭","d":"전부를 한데 모아 두루 일컬음. 또는 그런 이름.","s":"그는 세칭 명문 대학 출신이었다."}]},{"n":155,"w":"퇴보","st":"퇴보","d":"정도나 수준이 이제까지의 상태보다 뒤떨어지거나 못하게 됨.","ex":"역사는 발전과 퇴보가 끊임없이 반복되면서 나아가는 것이다. 발전 퇴보","cx":"철기의 등장은 점차 청동기 문화의 퇴보로 이어졌다. 단단한 철기는 전보다 널리 사용되었지만, 무른 청동은 전보다 사용되지 않았기 때문이다. 그 이후 청동의 쓰임은 제사처럼 제한된 부분에 그치게 되었다.","r":[{"t":"관련어","w":"퇴보하다","d":"정도나 수준이 이제까지의 상태보다 뒤떨어지거나 못하게 되다.","s":"전 쟁 때문에 국가의 경제 수준이 십 년은 퇴보하였다."},{"t":"반의어ㆍ과학","w":"진보","d":"정도나 수준이 나아지거나 높아짐.","s":"과학의 발전은 인류의 진보에 큰 영향을 끼쳤다."},{"t":"유의어ㆍ사회","w":"후진","d":"어떤 발전 수준에 뒤지거나 뒤떨어짐. 또는 그런 사람.","s":"제 국주의 시대 서구 열강들은 당시 후진이던 아시아의 여러 국가들을 식민지로 삼아 경제적 이득을 취했다."}]},{"n":156,"w":"퇴화하다","st":"퇴화","d":"진보 이전의 상태로 되돌아감.","ex":"잘 쓰이지 않는 언어들은 퇴화하여 사라져 버리기도 한다.","cx":"전문가들은 AI 시대에 인간의 인지 능력이 퇴화할 수 있다고 우려한다. AI가 업무를 대신할수록 인간은 업무에 활용하던 사고력과 창의력을 더 이상 쓰지 않게 된다. 이러한 과정이 반복되면 인간의 인지 능력은 전보다 위축될 수 있다.","r":[{"t":"생명과학","w":"퇴화하다","d":"생물체의 기관 등이 단순화되고 크기가 감소하는 따위의 진화나 성장 과정에서 현재 이전의 상태나 시기로 되돌아가는 변화.","s":"닭은 날개가 퇴화하여 잘 날지 못하고 지상에서 생활한다."},{"t":"유의어ㆍ사회","w":"전진","d":"앞으로 나아감.","s":"21세기에 민주주의를 파괴하는 독재자가 등장했다는 것은 역사적 퇴행이었다."}]},{"n":157,"w":"평면적","st":"평면적","d":"겉으로 나타난 일반적인 사실만을 논의하거나 표현하는 것.","ex":"이 책은 그 사건에 대해 사실만을 충실하게 전달하는 평면적인 서술을 하고 있다.","cx":"우리는 단순히 평면적인 모습만 보고 사람을 판단하기도 한다. 속마음을 드러내는 깊은 대화를 나누기보다 겉으로 보이는 그 사람의 행동만 본다면, 그 사람에 대해서 일차원적인 부분밖에 알 수 없을 것이다.","r":[{"t":"국어","w":"평면적 성격","d":"소설 등의 이야기에서 등장인물이 보이는 하나의 일관된 성격. 평면 확장","s":"고전소설에 등장하는 인물들은 대부분 평면적 성격을 보인다."},{"t":"유의어","w":"표면적","d":"겉으로 나타나거나 눈에 띄는 것.","s":"애인과 이별한 그는 표면적으로는 아무 일 없는 듯 무심한 표정이었다."},{"t":"반의어ㆍ미술","w":"입체적","d":"사물을 여러 각도에서 종합적으로 파악하는 것.","s":"이 그림은 입체적 기법을 사용하여 실물처럼 느껴진다."}]},{"n":158,"w":"피상적","st":"피상적","d":"본질적인 현상은 추구하지 않고 겉으로 드러나 보이는 현상에만 주목하는 것.","ex":"시간이 부족했기 때문에 복잡한 사건을 피상적으로밖에 다룰 수 없었다.","cx":"그와 나는 첫 만남이 어색했기 때문에 피상적인 내용만 가지고 대화했다. ‘키가 어느 정도인지’, ‘직업이 무엇인지’처럼 겉으로 보이는 내용만을 이야기했기 때문에 그 사람에 대해 알 수 있는 것은 단순한 것들뿐이었다.","r":[{"t":"관련어","w":"피상적","d":"본질적인 현상은 추구하지 아니하고 겉으로 드러나 보이는 현상에만 관계하는.","s":"보이는 현상만을 이야기하는 것은 피상적 관찰에 불과하다."},{"t":"유의어","w":"외면적","d":"겉으로 나타난 모양에만 관계된 것.","s":"두 사람 사이에는 깊이 있는 내용은 없이 형식적인 대화만 오갔다."}]},{"n":159,"w":"하위","st":"하위","d":"낮은 지위나 등급이나 위치.","ex":"생물을 하위 분류하면 동물과 식물로 나눌 수 있다. 생물","cx":"우리 학교 축구팀은 팀 성적이 하위에 놓였다. 앞선 경기들에서 다른 팀들보다 더 많이 패배했기 때문에 낮은 위치의 성적표를 받을 수밖에 없었다.","r":[{"t":"관련어ㆍ국어","w":"하위어","d":"어떤 말보다 구체적이고 자세한 뜻이 있는 말.","s":"하위어 ‘금붕어’는 상위어인 ‘물고기’의 의미를 포함하고 있다."},{"t":"반의어","w":"상위","d":"높은 위치나 지위.","s":"마라톤에서 세 명의 선수가 상위 그룹을 이루며 가장 앞서서 뛰고 있었다."},{"t":"반의어","w":"고위","d":"높고 귀한 지위.","s":"정부 고위 관계자는 이 정책이 경제 회복에 중요한 전환점이 될 것이라고 밝혔다. 하위"}]},{"n":160,"w":"하한선","st":"하한선","d":"더 이상 내려갈 수 없는 한계선.","ex":"최저 임금 제도는 근로자에게 줘야 하는 임금의 하한선을 정해 놓은 제도이다.","cx":"골동품 경매에 나선 주인은 가격의 하한선을 백만 원으로 설정했다. 그 골동품이 갖고 싶은 사람들은 백만 원 이상의 금액부터 경매를 시작할 수 있었다. 그보다 낮은 금액을 준비한 사람들은 경매에 참여하지 못했다.","r":[{"t":"관련어","w":"하한","d":"위아래로 일정한 범위를 이루고 있을 때, 아래쪽의 한계.","s":"이 온도계가 측정할 수 있는 온도의 상한은 +50도이고, 하한은 -3도이다."},{"t":"관련어ㆍ경제","w":"상한선","d":"더 이상 올라갈 수 없는 한계선.","s":"내가 구입한 주식이 이틀 동안 연이어 하한가를 맞았다."}]},{"n":161,"w":"하향","st":"하향","d":"아래로 향함. 또는 그 쪽.","ex":"청소년 인구가 급격하게 줄어들면서 연도별 대학 입학 경쟁률은 하향 곡선을 그리고 있다.","cx":"한국은행은 올해 경제 성장률을 하향 조정하였다. 한국은행이 밝힌 경제 성장률은 올해 초 1.5%였지만, 5월에는 0.8%로 바뀌어 기존보다 0.7%가 낮아졌다. 전문가들은 우리나라 경제가 원래 예상보다 더 적게 성장할 것이라고 예상하고 있다.","r":[{"t":"관련어","w":"하향식","d":"정책 따위가 위에서 결정되어 아래로 전달되는 방식.","s":"윗사람의 명령을 무조건 강요하는 하향식 의사 결정은 민주적이지 않다."},{"t":"유의어","w":"쇠퇴","d":"기세나 상태가 약해져 전보다 못하여 감.","s":"나이가 들면 기억력의 쇠퇴가 오기 쉽다."},{"t":"유의어","w":"하락","d":"값이나 등급 따위가 떨어짐.","s":"농산물 가격 하락으로 농가들의 걱정이 깊어지고 있다."}]},{"n":162,"w":"고양","st":"고양","d":"정신이나 기분을 복돋워서 높임.","ex":"풍부한 어휘력은 인간 정신의 고양과 정서 함양에 크게 기여한다.","cx":"어려운 문제를 풀어낸 경험이 학습자의 자신감을 높여 주었다. 이에 대해 한 심리학자는 도전적인 문제를 해결한 경험이 자신감 고양에 영향을 준 것이라고 해석했다.","r":[{"t":"동형이의어","w":"고양","d":"경기도 고양시 고양하다: 정신이나 기분을 북돋워서 높이다.","s":"고양은 휴전선이 있는 파주와 접해 있다."},{"t":"관련어","w":"고무","d":"힘을 내도록 격려하여 용기를 북돋움.","s":"인간의 삶을 풍요롭게 고양하는 것이 좋은 문화의 전제 조건임을 인식하고 의미 있는 대중문화를 생산해야 한다."}]},{"n":163,"w":"고착","st":"고착","d":"어떤 상황이나 현상이 굳어져 변하지 않음.","ex":"분단의 고착을 막고 통일을 앞당기려는 노력이 필요하다.","cx":"한반도가 처음 38선을 경계로 나누어졌을 때는 아무도 이 분단이 오래 갈 것이라고 생각하지 않았다. 그러나 휴전 상태로 50년이 지나자 분단이 바꾸기 어려운 고착 상태에 이르렀다는 인식이 확대되었다.","r":[{"t":"심리","w":"고착","d":"특정한 대상이나 생각에 집착하여 벗어나지 못함. 또는 그런 상태.","s":"심리적 고착 상태"},{"t":"관련어","w":"고착되다","d":"어떤 상황이나 현상이 굳어져 변하지 아니하게 되다.","s":"역사적으로 지속된 반목과 대립이 상대 종교에 대한 배타적인 태도로 고착되기도 한다."},{"t":"유의어","w":"고정","d":"한곳에 꼭 붙어 있거나 붙어 있게 함.","s":"그곳에 고정으로 배치돼 있는 순경이 보고를 받고 달려왔다."}]},{"n":164,"w":"고찰","st":"고찰","d":"어떤 것을 깊이 생각하고 연구함.","ex":"문화에 대한 고찰 없이 인간의 삶을 이해하는 것은 불가능하다.","cx":"과학자들은 이 새로운 현상에 대해 깊이 생각하고 연구하기 시작했다. 그들의 고찰은 곧 새로운 현상에 대한 통찰력 있는 해석으로 이어졌다.","r":[{"t":"동형이의어","w":"고찰","d":"역사가 오래된 옛 절.","s":"양양 낙산사는 의상 대사가 창건한 절로 동해의 고찰이다."},{"t":"관련어","w":"생각","d":"사물을 헤아리고 판단하는 작용.","s":"그는 현대인들의 소외의 양상을 유형별로 고찰하고자 한 사회심리학자였다."}]},{"n":165,"w":"고취","st":"고취","d":"힘을 내도록 격려하여 용기를 북돋움.","ex":"교육부는 각 대학 교수들의 연구 의욕 고취를 위한 방안을 마련하라고 지시했다.","cx":"선생님은 학생들이 학습에 대한 의욕이 높아지기를 바라는 마음으로 학생들을 일일이 격려하고 용기를 북돋아 주었다. 학습 의욕 고취를 위한 선생님의 노력에 보답이라도 하듯 학생들은 열심히 공부했다.","r":[{"t":"관련어","w":"고취하다","d":"의견이나 사상 따위를 열렬히 주장하여 불어넣다.","s":"노동자의 안전 의식을 고취하고, 사업주에게는 안전 의무를 지키도록 규제하고 있다."},{"t":"유의어","w":"격려","d":"용기나 의욕이 솟아나도록 북돋워 줌.","s":"지친 나그네에게 마음에 맞는 길동무의 고무적인 격려는 의욕과 힘을 돋우어 준다."},{"t":"유의어","w":"부채질","d":"어떤 감정이나 싸움, 상태의 변화를 더욱 부추기는 일을 비유적으로 이르는 말.","s":"우리는 그녀의 분노를 부채질하지 않기 위해 조용히 숨을 죽였다."}]},{"n":166,"w":"관점","st":"관점","d":"사물이나 현상을 관찰할 때, 그 사람이 보고 생각하는 태도나 방향 또는 처지.","ex":"그들은 한 가지 사물을 서로 다른 관점에서 바라보았다.","cx":"같은 사건이라도 피해자와 가해자가 전혀 다른 이야기를 하는 경우가 있다. 피해자의 입장과 가해자의 입장이 다르기 때문에, 각자의 관점에서 사건을 해석하는 방식도 다른 것이다.","r":[{"t":"사회","w":"통합적 관점","d":"인간과 세상을 이해하기 위해 시간적, 공간적, 사회적, 윤리적 관점을 함께 고려하는 것.","s":"현대 사회의 불확실하고 복잡한 사회현상에 대처하려면 통합적 관점이 필요하다."},{"t":"매체","w":"매체 생산자의 관점","d":"매체 자료 생산자의 정체성, 의도, 관련된 이해관계 등을 말함.","s":"매체 생산자의 관점을 파악하고 매체 자료의 신뢰성을 판단할 줄 알아야 한다."},{"t":"유의어","w":"시각","d":"사물을 관찰하고 파악하는 기본적인 자세.","s":"창의적인 방식으로 대상을 다루기 위해서는 관습적인 시각이 아닌 새로운 시각에서 접근해야 한다."}]},{"n":167,"w":"괴리","st":"괴리","d":"서로 어그러져 동떨어짐.","ex":"교육과정과 현실 생활의 괴리가 큰 것으로 나타나자, 교육과정을 바꿔야 한다는 주장이 제기되었다.","cx":"그들이 바라는 사회의 모습은 실제 현실 사회가 보여 주는 모습과 매우 달랐다. 그들은 이상과 현실 사이의 괴리에서 가치관의 혼란을 느꼈다.","r":[{"t":"관련어","w":"괴리감","d":"서로 어그러져 동떨어져 있는 느낌.","s":"마음껏 누리는 디지털 세상과 달리 현실은 그렇지 못하여 괴리감을 호소하는 사람들이 늘고 있다."},{"t":"관련어","w":"괴리되다","d":"서로 어그러져 동떨어지다.","s":"현실에서 괴리된 문학은 감동이 적을 수밖에 없다."},{"t":"반의어","w":"일치","d":"비교되는 대상들이 서로 어긋나지 않고 같거나 들어맞음.","s":"다행히 의견이 일치가 이루어졌다."}]},{"n":168,"w":"교섭","st":"교섭","d":"어떤 일을 이루기 위하여 서로 의논하고 절충함.","ex":"총파업 직전에 노동조합과 회사측의 교섭이 타결되었다.","cx":"수학 동아리 학생들은 학교 측으로부터 비용을 지원받아 수학 캠프에 참가하고 싶어 하였고, 학교 측은 예산 부족으로 인해 비용을 지원해 주기 어려운 상황에서 의논을 시작했다. 그리고 서로의 입장을 조금씩 절충하여 적절한 선에서 교섭을 타결했다.","r":[{"t":"정치","w":"교섭 단체","d":"국회에서 의사 진행에 관한 중요한 안건을 협의하기 위해 일정 수 이상의 의원들로 구성한 의원 단체.","s":"국회법에 따르면 20인 이상의 의원이 모여야 교섭 단체를 구성할 수 있다."},{"t":"경제","w":"교섭력","d":"어떤 일을 이루기 위해 상대편과 의논하고 절충할 수 있는 능력.","s":"계약 당사자 사이에 교섭력이 어느 정도 대등해야 계약 내용이 적정하게 정해질 것이다."},{"t":"유의어","w":"협상","d":"어떤 목적에 맞는 결정을 하기 위해 여럿이 서로 의논함.","s":"임금 협상"}]},{"n":169,"w":"인식","st":"인식","d":"사물을 구별하고 판단하여 앎.","ex":"청소년에게 올바른 역사에 대한 인식을 심어 주는 것이 중요하다.","cx":"사물에 대한 그릇된 인식을 고치는 것은 쉽지 않다. 올바른 사고를 바탕으로 인지를 개선하기 위한 노력이 뒷받침되어야 가능하다.","r":[{"t":"유의어","w":"인지","d":"어떠한 사실을 인정하여 앎.","s":"운전자는 교통사고에 대한 인지를 하지 못하고 자리를 떠나 버렸다."},{"t":"기술","w":"지문 인식","d":"사람마다 다른 지문을 분별하고 판단하여 앎. 그러한 기술.","s":"지문 인식은 오늘날 가장 널리 사용되고 있는 생체 인식 기술이다."}]},{"n":170,"w":"일탈","st":"일탈","d":"정하여진 영역 또는 본래의 목적이나 조직 따위로부터 빠져 벗어남.","ex":"권위와 통제만으로는 개개인의 일탈을 막을 수 없다.","cx":"한 사람의 일탈이 조직 전체의 분위기를 안 좋게 만들 수 있다. 조직의 기본적인 규칙을 지키지 않으면 구성원들이 이탈하여 오랫동안 함께하기 어렵다.","r":[{"t":"유의어","w":"탈선","d":"목적 이외의 딴 길로 빠짐.","s":"당초 목적에서의 탈선을 방지하기 위해서는 관리 감독을 철저히 해야 한다."},{"t":"반의어","w":"준수","d":"전례나 규칙, 명령 따위를 그대로 따르며 지킴.","s":"공사 현장에서 사고를 줄이기 위해서는 안전 수칙 준수가 필수적이다."},{"t":"사회","w":"일탈","d":"사회적인 규범으로부터 벗어나는 일.","s":"가정 교육의 붕괴로 인해 청소년들의 일탈이 늘고 있다."}]},{"n":171,"w":"분화","st":"분화","d":"단순하거나 같은 성질을 지닌 것에서 복잡하거나 다른 성질을 지닌 것으로 변함.","ex":"산업이 전문화되면서 직업의 분화가 자연스럽게 이루어졌다.","cx":"도시가 성장하면 원래는 별도의 구분이 없던 도시 내부가 상업, 공업, 주거 등의 기능에 따라 나뉘게 된다. 이러한 분화는 도시의 기능이 다양해지고 복잡해지면서 발생한다.","r":[{"t":"동형이의어","w":"분화","d":"화산성 물질이 지구 내부에서 표면으로 방출됨. 또는 그런 현상을 통틀어 이르는 말.","s":"화산이 분화하다."},{"t":"유의어","w":"이질화","d":"바탕이나 성질이 달라짐. 또는 바탕이나 성질을 달라지게 함.","s":"남북한 언어의 이질화가 심해지고 있다."},{"t":"생명","w":"분화하다","d":"단순하거나 등질인 것에서 이질인 것으로 변하다.","s":"줄기세포는 다양한 세포로 분화할 수 있다."}]},{"n":172,"w":"상반","st":"상반","d":"서로 반대되거나 어긋남.","ex":"인(仁)과 의(義)는 상반인 듯 하지만 실은 상호 보완적인 관계라 할 수 있다.","cx":"그는 물을 엎지른 종업원에게 지나치게 화를 냈다. 누구든 존중해야 한다던 평소 그의 주장과는 어긋나는 모습이었다. 그의 말과 행동의 상반에서 위선을 느꼈다.","r":[{"t":"동형이의어","w":"상반","d":"서로 절반씩 어슷비슷함.","s":"이득과 손실이 상반이다."},{"t":"유의어","w":"모순","d":"어떤 사실의 앞뒤, 또는 두 사실이 이치상 어긋나서 서로 맞지 않음을 이르는 말.","s":"그와 같은 논리의 전개에는 많은 모순이 있다."}]},{"n":173,"w":"객체","st":"객체","d":"생각이나 행위가 미치는 대상.","ex":"객체 법률에서 행위의 객체는 어떤 행위가 가해지는 대상을 가리킨다.","cx":"현주는 산 정상에서 풍경을 오랫동안 바라보았다. 그녀는 풍경과 자신의 관계에 대해 생각하다가, 이런 생각을 하는 자신은 주체이고 자신이 바라보는 대상인 풍경은 객체라는 사실을 깨달았다.","r":[{"t":"반의어","w":"주체","d":"사물의 작용이나 어떤 행동의 주가 되는 것.","s":"우리는 우리 삶의 주체로서 스스로 삶의 방향을 설정해야 한다."},{"t":"유의어","w":"대상","d":"어떤 일의 상대 또는 목표나 목적이 되는 것.","s":"내가 이겨 내야 할 대상은 바로 나 자신이다."},{"t":"국어","w":"객체 높임법","d":"‘뵙다’, ‘드리다’, ‘여쭈다’처럼 문장의 객체를 높여 표현하는 높임법.","s":"국어의 높임법에는 주체 높임법, 상대 높임법, 객체 높임법이 있다."}]},{"n":174,"w":"견지","st":"견지","d":"어떤 견해나 입장을 굳게 지니거나 지킴.","ex":"그는 목숨이 위태로운 상황에서도 원칙 견지를 위해 끝까지 노력했다. 견지","cx":"그는 자신의 주장을 굳게 지키며 토론을 이어갔다. 상대방의 비난에도 불구하고 흔들림 없이 일관되게 입장 견지를 한 것이다.","r":[{"t":"동형이의어","w":"견지","d":"어떤 사물을 판단하거나 관찰하는 입장.","s":"인도적 견지에서 이웃 나라에 식량을 지원했다."},{"t":"관련어","w":"견지하다","d":"어떤 견해나 입장을 굳게 지니거나 지키다.","s":"시민운동가들은 평등권의 보장을 위한 자신들의 입장을 오래전부터 견지해 왔다."},{"t":"유의어","w":"고집","d":"자기의 의견을 바꾸거나 고치지 않고 굳게 버팀.","s":"할머니는 혼자라도 시골에서 사시겠다고 고집을 하셨다."}]},{"n":175,"w":"결부","st":"결부","d":"일정한 사물이나 현상을 서로 연관시킴.","ex":"그는 책을 읽고 자신의 경험과 결부를 지어 감상문을 썼다. A B","cx":"그는 자신의 성공이 오직 노력에 의한 것이라고 생각했지만, 사실 그 과정에는 주변 사람들의 도움도 결부가 되어 있었다. 그의 성공은 개인의 힘만으로 이루어진 것이 아니라 사회적 관계와도 긴밀히 이어져 있었던 것이다.","r":[{"t":"관련어","w":"결부되다","d":"일정한 사물이나 현상이 서로 연관되다.","s":"이 작품에서 공간적 배경은 인물의 성격 형성과 밀접하게 결부되어 있다."},{"t":"관련어","w":"결부하다","d":"일정한 사물이나 현상을 서로 연관시키다.","s":"과학자들은 기후 변화를 탄소 배출량과 결부하여 설명한다."},{"t":"유의어","w":"연관","d":"사물이나 현상이 일정한 관계를 맺는 일.","s":"이 일은 그 친구와는 연관이 없다."}]},{"n":176,"w":"경시","st":"경시","d":"대수롭지 않게 보거나 업신여김.","ex":"계속된 전쟁으로 인한 살상은 인명 경시 풍조로까지 이어졌다.","cx":"과학계에서는 실험용 쥐에 대한 생명 경시 현상을 우려해, 새롭게 생명 윤리 규정을 만들었다. 그 결과 실험용 동물의 생명을 대수롭지 않게 생각하던 일부 과학자들도 경각심을 가지게 되었다.","r":[{"t":"관련어","w":"경시되다","d":"대수롭지 않게 보이거나 업신여김을 당하다.","s":"국민의 자유와 권리는 헌법에 열거되지 아니한 이유로 경시되지 아니한다."},{"t":"관련어","w":"경시하다","d":"대수롭지 않게 보거나 업신여기다.","s":"리비스주의는 소수 계층의 문화만을 존중하고 대중문화를 경시한다 는 점에서 엘리트주의적 입장이라는 비판을 받는다."},{"t":"반의어","w":"중시","d":"가볍게 여길 수 없을 만큼 매우 크고 중요하게 여김.","s":"성장 중시 논리가 가져온 부작용도 있었다."}]},{"n":177,"w":"경위","st":"경위","d":"출발 일이 진행되어 온 과정.","ex":"사건A 경찰은 이번 사건의 경위를 밝히는 기자회견을 하겠다고 했다. 사건B","cx":"어제 도서관에서 인기 도서가 여러 권 사라져, 그 경위를 조사하고 있다. 책들이 어떻게 사라지게 되었는지 그 과정을 밝히기 위해 책들이 사라진 시간대에 도서관에 있던 사람들에게 질문을 하기로 했다.","r":[{"t":"유의어","w":"과정","d":"일이 되어 가는 경로.","s":"사춘기의 발달 과정에서 나타나는 변화들에 대해 부모가 미리 알아 둘 필요가 있다."},{"t":"과학","w":"경위도 원점","d":"지구상의 한 점의 위치를 표시하기 위해 사용하는 경도와 위도의 기준이 되는 점.","s":"우리나라의 경위도 원점은 국토지리정보원 내에 위치해 있다."}]},{"n":178,"w":"계열","st":"계열","d":"서로 관련이 있거나 유사한 점이 있어 서 한 갈래로 이어지는 계통이나 조직.","ex":"염상섭의 소설은 사실주의 계열의 작품이다. 계열","cx":"철학과 문학, 역사는 별개의 학문 같지만, 인간의 삶을 깊이 탐구한다는 점에서 서로 긴밀하게 관련된다. 그래서 이들을 하나의 갈래로 묶어 ‘인문 계열’이라고 말하는 것이다.","r":[{"t":"유의어","w":"관련","d":"둘 이상의 사람, 사물, 현상 등이 서로 관계를 맺어 매여 있음. 또는 그 관계.","s":"종교 관련 서적은 5번 기둥 옆에 있습니다."},{"t":"지구과학","w":"주계열성","d":"질량이 클수록 표면 온도가 높고 더 밝아지는 주계열에 속하는 별.","s":"주계열성은 별의 크기가 일정하게 유지되는 안정한 시기로, 별은 일생의 대부분을 이 단계에 머무른다."},{"t":"경제","w":"계열사","d":"경영주가 같거나 사업 계통이 같아서 서로 밀접한 관련이 있는 회사.","s":"그룹 회장이 계열사 사장단 회의를 소집했다."}]},{"n":179,"w":"계통","st":"계통","d":"하나의 공통적인 것에서 갈려 나온 갈래.","ex":"언어학에서는 서로 다른 언어들이 같은 뿌리에서 갈라져 나온 경우, 같은 계통의 언어라고 말한다. 계통","cx":"생물학에서는 생물들을 공통 조상으로부터 갈라져 나온 계통에 따라 분류한다. 이러한 분류는 단순한 외형이 아니라, 유전적 특징과 진화 과정을 고려한 계통적 관계를 보여 준다.","r":[{"t":"유의어","w":"갈래","d":"하나에서 둘 이상으로 갈라져 나간 낱낱의 부분이나 계통.","s":"한 조상에서 나온 갈래들이기 때문에 고대 삼국의 언어들은 밀접한 친족 관계에 있었다."},{"t":"통계","w":"계통 추출","d":"모집단에서 임의로 첫 번째 표본을 선택한 후, 일정한 간격으로 다음 표본을 체계적으로 선택하여 표본을 구성하는 방법.","s":"임의 표본을 선택하는 방법은 표본을 추출하는 방법에 따라 단순 임의 추출, 층화 임의 추출, 계통 추출 등이 있다."},{"t":"생명","w":"계통도","d":"계통 관계를 나타낸 그림.","s":"코로나 바이러스 감염증을 일으키는 바이러스 변이체의 유연관계 를 보여 주는 계통도는 RNA 염기 서열 비교를 통해 만들어졌다. 계통"}]},{"n":180,"w":"고안","st":"고안","d":"연구하여 새로운 안을 생각해 냄.","ex":"모든 과학적 발명과 고안이 인류의 삶에 긍정적인 것만은 아니다.","cx":"그는 오래된 문제를 해결하기 위해 새로운 방법을 고안 중이었다. 여러 시행착오 끝에 결국 그가 만들어 낸 새로운 방법은 창의적이고 실용적이라는 평가를 받으며 현장에 널리 적용되었다.","r":[{"t":"관련어","w":"고안자","d":"연구하여 새로운 안을 내거나 새로운 물건을 만든 사람.","s":"통조림의 고안자는 프랑스의 양조업자였다."},{"t":"관련어","w":"고안하다","d":"연구하여 새로운 안을 생각해 내다.","s":"국내 총생산의 한계를 보완할 수 있는 지표를 고안해 보자."},{"t":"유의어","w":"발명","d":"아직까지 없던 기술이나 물건을 새로 생각하여 만들어 냄.","s":"증기 기관의 발명은 영국 산업 혁명의 발판이 되었다."}]},{"n":181,"w":"근간","st":"근간","d":"뿌리와 줄기를 아울러 이르는 말.","ex":"또는 사물의 바탕이나 중심이 되는 중요한 것. 부모님의 사랑과 지지가 근간을 이루어, 그는 자신과 세상을 긍정적 으로 볼 줄 아는 사람으로 성장했다.","cx":"한 국가의 고유한 문화와 전통은 그 민족의 정체성을 형성하는 중요한 근간이 된다. 이러한 문화적 뿌리가 깊을수록 외부의 변화에도 흔들리지 않고 고유한 특성을 유지하며 발전할 수 있다.","r":[{"t":"관련어","w":"근간적","d":"중요한 기본 바탕이 되는.","s":"그의 사상은 현대 철학의 근간적 흐름을 형성하는 데 큰 영향을 미쳤다."},{"t":"관련어","w":"근간부","d":"사물의 바탕이나 중심이 되는 중요한 부분.","s":"우리 회사의 재정은 연구 개발 투자가 근간부를 이룬다."},{"t":"유의어","w":"근본","d":"사물의 본질이나 본바탕.","s":"우리 경제가 불황 상태에 있는 것이 주가 하락의 근본 원인이다."}]},{"n":182,"w":"기반","st":"기반","d":"기초가 되는 바탕. 또는 사물의 토대.","ex":"건강한 식습관은 신체 활동을 위한 중요한 에너지 기반이다.","cx":"기업의 지속 가능한 성장을 위해서는 탄탄한 재정 기반이 필수적이다. 이것이 충분히 갖춰지지 않으면 아무리 혁신적인 아이디어가 있어도 실행하기 어렵고, 외부 환경 변화에 취약해질 수밖에 없다.","r":[{"t":"관련어","w":"기반하다","d":"바탕이나 토대를 두다.","s":"그는 오랜 경험에 기반하여 사건을 해결했다."},{"t":"지리","w":"기반암","d":"겉흙의 아래에 놓여 있는 굳은 암석. 또는 퇴적물 아래의 지각 부분. 보통 화성암과 변성암의 복합체로 이루어진다.","s":"강릉의 암석 해안은 기반암이 단단한 상태로 노출되어 있는 해안이다."}]},{"n":183,"w":"기제","st":"기제","d":"기계적으로 구성되어 있는 조직이나 공식 따위의 내부 구성. 또는 인간의 행동에 영향을 미치는 심리의 작용이나 원리.","ex":"소비자의 지갑을 열게 하는 심리적 기제를 이해하는 것은 마케팅의 핵심이다. 남들과 유행하면 산다. 똑같은 건 싫다.","cx":"인간이 새로운 지식을 습득하고 기억하는 과정에는 복잡한 인지적 기제가 작용한다. 뇌는 정보를 분류하고 연결하며 장기 기억으로 전환하는 일련의 과정을 통해 학습을 가능하게 하는 내부 원리를 따른다.","r":[{"t":"관련어","w":"방어 기제","d":"두렵거나 불쾌한 정황이나 욕구 불만에 직면하였을 때 스스로를 방어하기 위하여 자동적으로 취하는 적응 행위.","s":"과거의 고통스러운 기억을 잊어버리는 것은 방어 기제의 한 형태이다."},{"t":"유의어","w":"기제론","d":"모든 현상을 자연적 인과 관계와 역학적 법칙으로 설명하려는 이론.","s":"화학 반응의 기구를 밝혔다."}]},{"n":184,"w":"내재","st":"내재","d":"어떤 사물이나 범위의 안에 들어 있음.","ex":"또는 그런 존재. 이 기술은 제품 자체적 보안 기능 내재로 안전성을 확보했다.","cx":"칸트 철학에서 도덕 법칙은 외부의 명령이 아닌, 인간 이성 자체의 내재로 설명된다. 이는 인간의 도덕을 이성 자체에서 비롯된 보편적 법칙으로 정립하려는 것이며, 선악의 판단 기준이 인간 내면에 본래부터 존재함을 의미한다.","r":[{"t":"관련어","w":"내재 역량","d":"노인의 신체적, 인지적, 심리적 기능을 포함한 전반적인 건강 잠재력.","s":"건강하게 나이 들고 싶다면 내재 역량을 높여야 한다."},{"t":"반의어","w":"외재","d":"어떤 사물이나 범위 안에 있지 않고 밖에 있음. 또는 그런 존재.","s":"작품이 현실을 반영하는 양상 등 작품의 외재 요인을 고려하여 문학 작품을 감상할 수도 있다."},{"t":"국어","w":"내재율","d":"자유시나 산문시에서 문장에 잠재적으로 깃들어 있는 운율.","s":"이 작품에서 시어의 반복을 통해 형성되는 내재율을 확인할 수 있다."}]},{"n":185,"w":"내포","st":"내포","d":"어떤 성질이나 뜻 따위를 속에 품음.","ex":"작가가 쓴 단어의 내포 의미를 파
